<!DOCTYPE html>
<html lang="en" class="console-operations-page">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Toronto Zoo Operations Console</title>

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link
         href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
         rel="stylesheet"
      >

      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script type="module" src="../scripts/consoleOperations.js"></script>
   </head>

   <body>
      <div class="console-operations-page">

         <div class="top-bar">
            <span class="top-bar-title">Toronto Zoo Operations Console</span>
            <img
               src="../images/logos/toronto-zoo-logo.png"
               alt="Toronto Zoo Logo"
               class="top-bar-logo"
            >
         </div>

         <main>

            <aside class="side-panel left" aria-label="Operations menu">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">Operations</h2>
               </div>

               <div class="side-panel-body">
                  <p class="console-operations-side-panel-text">
                     Choose an operation to manage animal visibility, exhibits, restaurants, attractions, and scheduled zoo experiences.
                  </p>

                  <section class="console-operations-menu">
                     <button
                        type="button"
                        id="showOffDisplayForm"
                        class="console-operations-menu-btn"
                        data-panel-target="offDisplayPanel"
                     >
                        <span class="console-operations-menu-btn-number">1</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal as off display
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showOnDisplayForm"
                        class="console-operations-menu-btn"
                        data-panel-target="onDisplayPanel"
                     >
                        <span class="console-operations-menu-btn-number">2</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal as on display
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showVisibilityScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="visibilitySchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">3</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal visibility schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveVisibilityScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeVisibilitySchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">4</span>
                        <span class="console-operations-menu-btn-label">
                           Remove animal visibility schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showViewingAlertForm"
                        class="console-operations-menu-btn"
                        data-panel-target="viewingAlertPanel"
                     >
                        <span class="console-operations-menu-btn-number">5</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal viewing alert
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveViewingAlertForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeViewingAlertPanel"
                     >
                        <span class="console-operations-menu-btn-number">6</span>
                        <span class="console-operations-menu-btn-label">
                           Remove animal viewing alert
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showExhibitClosedForm"
                        class="console-operations-menu-btn"
                        data-panel-target="exhibitClosedPanel"
                     >
                        <span class="console-operations-menu-btn-number">7</span>
                        <span class="console-operations-menu-btn-label">
                           Set exhibit as closed
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showExhibitOpenForm"
                        class="console-operations-menu-btn"
                        data-panel-target="exhibitOpenPanel"
                     >
                        <span class="console-operations-menu-btn-number">8</span>
                        <span class="console-operations-menu-btn-label">
                           Set exhibit as open
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRestaurantClosedForm"
                        class="console-operations-menu-btn"
                        data-panel-target="restaurantClosedPanel"
                     >
                        <span class="console-operations-menu-btn-number">9</span>
                        <span class="console-operations-menu-btn-label">
                           Set restaurant as closed
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRestaurantOpenForm"
                        class="console-operations-menu-btn"
                        data-panel-target="restaurantOpenPanel"
                     >
                        <span class="console-operations-menu-btn-number">10</span>
                        <span class="console-operations-menu-btn-label">
                           Set restaurant as open
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRestaurantOpeningScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="restaurantOpeningSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">11</span>
                        <span class="console-operations-menu-btn-label">
                           Set restaurant opening schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveRestaurantOpeningScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeRestaurantOpeningSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">12</span>
                        <span class="console-operations-menu-btn-label">
                           Remove restaurant opening schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showGiftShopClosedForm"
                        class="console-operations-menu-btn"
                        data-panel-target="giftShopClosedPanel"
                     >
                        <span class="console-operations-menu-btn-number">13</span>
                        <span class="console-operations-menu-btn-label">
                           Set gift shop as closed
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showGiftShopOpenForm"
                        class="console-operations-menu-btn"
                        data-panel-target="giftShopOpenPanel"
                     >
                        <span class="console-operations-menu-btn-number">14</span>
                        <span class="console-operations-menu-btn-label">
                           Set gift shop as open
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showGiftShopOpeningScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="giftShopOpeningSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">15</span>
                        <span class="console-operations-menu-btn-label">
                           Set gift shop opening schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveGiftShopOpeningScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeGiftShopOpeningSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">16</span>
                        <span class="console-operations-menu-btn-label">
                           Remove gift shop opening schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showAttractionClosedForm"
                        class="console-operations-menu-btn"
                        data-panel-target="attractionClosedPanel"
                     >
                        <span class="console-operations-menu-btn-number">17</span>
                        <span class="console-operations-menu-btn-label">
                           Set attraction as closed
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showAttractionOpenForm"
                        class="console-operations-menu-btn"
                        data-panel-target="attractionOpenPanel"
                     >
                        <span class="console-operations-menu-btn-number">18</span>
                        <span class="console-operations-menu-btn-label">
                           Set attraction as open
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showZoomobileStationClosedForm"
                        class="console-operations-menu-btn"
                        data-panel-target="zoomobileStationClosedPanel"
                     >
                        <span class="console-operations-menu-btn-number">19</span>
                        <span class="console-operations-menu-btn-label">
                           Set zoomobile station as closed
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showZoomobileStationOpenForm"
                        class="console-operations-menu-btn"
                        data-panel-target="zoomobileStationOpenPanel"
                     >
                        <span class="console-operations-menu-btn-number">20</span>
                        <span class="console-operations-menu-btn-label">
                           Set zoomobile station as open
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showZoomobileRouteForm"
                        class="console-operations-menu-btn"
                        data-panel-target="zoomobileRoutePanel"
                     >
                        <span class="console-operations-menu-btn-number">21</span>
                        <span class="console-operations-menu-btn-label">
                           Set current Zoomobile route
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showGuardiansTalkScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="guardiansTalkSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">22</span>
                        <span class="console-operations-menu-btn-label">
                           Set Meet the Guardians talk schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showEndGuardiansTalkScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="endGuardiansTalkSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">23</span>
                        <span class="console-operations-menu-btn-label">
                           End Meet the Guardians talk schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showCancelGuardiansTalkOccurrenceForm"
                        class="console-operations-menu-btn"
                        data-panel-target="cancelGuardiansTalkOccurrencePanel"
                     >
                        <span class="console-operations-menu-btn-number">24</span>
                        <span class="console-operations-menu-btn-label">
                           Cancel Meet the Guardians talk occurrence
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showWildEncounterScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="wildEncounterSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">25</span>
                        <span class="console-operations-menu-btn-label">
                           Set Wild Encounter schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showEndWildEncounterScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="endWildEncounterSchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">26</span>
                        <span class="console-operations-menu-btn-label">
                           End Wild Encounter schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showCancelWildEncounterOccurrenceForm"
                        class="console-operations-menu-btn"
                        data-panel-target="cancelWildEncounterOccurrencePanel"
                     >
                        <span class="console-operations-menu-btn-number">27</span>
                        <span class="console-operations-menu-btn-label">
                           Cancel Wild Encounter occurrence
                        </span>
                     </button>
                  </section>
               </div>
            </aside>

            <div
               id="consoleOperationsWorkspace"
               class="map-container console-operations-workspace"
            ></div>

            <img
               class="side-image right"
               src="../images/map/right-side.png"
               alt="Right decoration"
            >

         </main>

      </div>
   </body>
</html>
