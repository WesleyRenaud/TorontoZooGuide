<!DOCTYPE html>
<html lang="en" class="console-operations-page">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Toronto Zoo Operations Console</title>

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link
         href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap"
         rel="stylesheet"
      >

      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script type="module" src="../scripts/consoleOperations.js"></script>
   </head>

   <body>
      <div class="console-operations-page">

         <div class="top-bar">
            <span class="top-bar-title">Toronto Zoo Operations Console</span>
            <img
               src="../images/logos/toronto-zoo-logo.png"
               alt="Toronto Zoo Logo"
               class="top-bar-logo"
            >
         </div>

         <main>

            <aside class="side-panel left" aria-label="Operations menu">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">Operations</h2>
               </div>

               <div class="side-panel-body">
                  <p class="console-operations-side-panel-text">
                     Choose an operation to update animal display status.
                  </p>

                  <section class="console-operations-menu">
                     <button
                        type="button"
                        id="showOffDisplayForm"
                        class="console-operations-menu-btn"
                        data-panel-target="offDisplayPanel"
                     >
                        <span class="console-operations-menu-btn-number">1</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal as off display
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showOnDisplayForm"
                        class="console-operations-menu-btn"
                        data-panel-target="onDisplayPanel"
                     >
                        <span class="console-operations-menu-btn-number">2</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal as on display
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showVisibilityScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="visibilitySchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">3</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal visibility schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveVisibilityScheduleForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeVisibilitySchedulePanel"
                     >
                        <span class="console-operations-menu-btn-number">4</span>
                        <span class="console-operations-menu-btn-label">
                           Remove animal visibility schedule
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showViewingAlertForm"
                        class="console-operations-menu-btn"
                        data-panel-target="viewingAlertPanel"
                     >
                        <span class="console-operations-menu-btn-number">5</span>
                        <span class="console-operations-menu-btn-label">
                           Set animal viewing alert
                        </span>
                     </button>

                     <button
                        type="button"
                        id="showRemoveViewingAlertForm"
                        class="console-operations-menu-btn"
                        data-panel-target="removeViewingAlertPanel"
                     >
                        <span class="console-operations-menu-btn-number">6</span>
                        <span class="console-operations-menu-btn-label">
                           Remove animal viewing alert
                        </span>
                     </button>
                  </section>
               </div>
            </aside>

            <div
               id="consoleOperationsWorkspace"
               class="map-container console-operations-workspace"
            ></div>

            <img
               class="side-image right"
               src="../images/map/right-side.png"
               alt="Right decoration"
            >

         </main>

      </div>
   </body>
</html>
