<!DOCTYPE html>
<html lang="en" class="home-page">
   <head>
      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js" defer></script>

      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

      <script type="module" src="../scripts/mainMap.js"></script>
   </head>

   <body>
      <div class="home-page">

         <!-- Top bar with title + logo -->
         <div class="top-bar">
            <span class="top-bar-title">Toronto Zoo Guide</span>
            <img 
               src="../images/logos/toronto-zoo-logo.png"
               alt="Toronto Zoo Logo"
               class="top-bar-logo"
            >
         </div>

         <main class="map-layout">
            <!-- LEFT PANEL: Explore menu -->
            <aside class="side-panel left" aria-label="Explore menu">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">Explore</h2>
               </div>

               <div class="side-panel-body">

                  <!-- Toggle -->
                  <div class="side-panel-toggle">
                     <label class="toggle-row">
                        <input id="showMapLabels" type="checkbox" checked>
                        <span>Show region/pavilion text</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeOffDisplayAnimals" type="checkbox">
                        <span>Include off display animals</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedRestaurants" type="checkbox">
                        <span>Include closed restaurants</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedRestrooms" type="checkbox">
                        <span>Include closed restrooms</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedGiftShops" type="checkbox">
                        <span>Include closed gift shops</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedAttractions" type="checkbox">
                        <span>Include closed attractions</span>
                     </label>
                  </div>

                  <div class="zoomobile-route">
                     <div class="zoomobile-route-title">
                        Zoomobile route
                     </div>

                     <div class="zoomobile-route-options">
                        <label class="zoomobile-route-option">
                           <input type="radio" name="zoomobileRoute" value="none" checked>
                           <span>None</span>
                        </label>

                        <label class="zoomobile-route-option">
                           <input type="radio" name="zoomobileRoute" value="current">
                           <span>Current Route</span>
                        </label>

                        <label class="zoomobile-route-option">
                           <input type="radio" name="zoomobileRoute" value="summer">
                           <span>Summer Route</span>
                        </label>

                        <label class="zoomobile-route-option">
                           <input type="radio" name="zoomobileRoute" value="winter">
                           <span>Winter Route</span>
                        </label>
                     </div>
                  </div>

                  <div class="filter-wrapper">
                     <div class="multi-select" id="typeFilter">
                        <button class="multi-select-button" type="button">
                           <span class="filter-label">Filter:</span>
                           <span class="selected-values"></span>
                        </button>

                        <div class="multi-select-dropdown">
                           <label>
                              <input type="checkbox" value="animal" checked>
                              Animals
                           </label>
                           <label>
                              <input type="checkbox" value="pavilion">
                              Pavilions
                           </label>
                           <label>
                              <input type="checkbox" value="restaurant">
                              Restaurants
                           </label>
                           <label>
                              <input type="checkbox" value="restroom">
                              Restrooms
                           </label>
                           <label>
                              <input type="checkbox" value="giftShop">
                              Gift Shops
                           </label>
                           <label>
                              <input type="checkbox" value="attraction">
                              Attractions
                           </label>
                           <label>
                              <input type="checkbox" value="guardiansTalk">
                              Meet The Guardians Talks
                           </label>
                           <label>
                              <input type="checkbox" value="wildEncounter">
                              Wild Encounters
                           </label>
                           <label>
                              <input type="checkbox" value="drinkingFountain">
                              Drinking Fountains
                           </label>
                           <label>
                              <input type="checkbox" value="defibrillator">
                              Defibrillators
                           </label>
                           <label>
                              <input type="checkbox" value="emergencyIntercom">
                              Emergency Intercoms
                           </label>
                           <label>
                              <input type="checkbox" value="guestService">
                              Guest Services
                           </label>
                           <label>
                              <input type="checkbox" value="picnicSite">
                              Picnic Sites
                           </label>
                           <label>
                              <input type="checkbox" value="eventSite">
                              Event Sites
                           </label>
                        </div>
                     </div>
                  </div>

                  <!-- Search -->
                  <div class="side-panel-search">
                     <label for="animalSearch" class="sr-only">Search animals</label>
                     <input
                        id="animalSearch"
                        class="animal-search"
                        type="text"
                        placeholder="Search..."
                        autocomplete="off"
                     >
                  </div>

                  <!-- Results -->
                  <div id="animalSearchResults" class="animal-search-results" aria-live="polite"></div>

                  <section class="explore-updates" aria-labelledby="exploreUpdatesTitle" hidden>
                     <div class="explore-updates-header">
                        <h3 id="exploreUpdatesTitle" class="explore-updates-title">Updates</h3>
                     </div>
                     <div id="exploreUpdatesList" class="explore-updates-list" aria-live="polite"></div>
                  </section>
               </div>
            </aside>

            <!-- MAP -->
            <div class="map-container">
               <!-- Dropdown container -->
               <div class="map-controls">
                  <select id="mapPreset">
                     <option value="" disabled hidden>Select a map</option>
                     <option value="summer">Summer Map</option>
                     <option value="winter">Winter Map</option>
                     <option value="specific-day" selected>Specific Map</option>
                  </select>

                  <!-- Date picker only relevant if "Specific Map" is selected -->
                  <input type="text" id="mapDate" placeholder="Select a date">
               </div>

               <div id="mapInner">
                  <div id="zooMapMount" aria-label="Toronto Zoo Map"></div>

                  <!-- markers injected here -->
               </div>

               <div id="tooltip" class="tooltip" style="display:none;"></div>
               <div id="hoverTooltip" class="hover-tooltip" style="display:none;"></div>
            </div>
         </main>

         <div id="speciesOverlay" class="species-overlay hidden">
            <div class="species-overlay-card">
               <button class="species-close"></button>
               <div class="species-overlay-content"></div>
            </div>
         </div>

         <!-- Bottom navigation menu -->
         <nav>
            <ul>
               <li><a href="map.html">Map</a></li>
               <li><a href="animals.html">Animals</a></li>
               <li><a href="https://www.torontozoo.com/meettheguardians">Meet The Guardians</a></li>
               <li><a href="https://www.torontozoo.com/wildencounters">Wild Encounters</a></li>
               <li><a href="itinerary.html">Itinerary</a></li>
            </ul>
         </nav>
      </div>
   </body>
</html>
