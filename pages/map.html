<!DOCTYPE html>
<html lang="en" class="home-page">
   <head>
      <!-- Stylesheets -->
      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <!-- jQuery (must be available before your module runs if you still use $.ajax) -->
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

      <!-- Vendor libs your modules rely on -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js" defer></script>

      <!-- ✅ Your map entry module (this replaces scripts.js on map.html) -->
      <script type="module" src="../scripts/main-map.js"></script>
   </head>

   <body>
      <div class="home-page">

         <!-- Top bar with title + logo -->
         <div class="top-bar">
            <span class="top-bar-title">Toronto Zoo Guide</span>
            <img 
               src="../images/logos/toronto-zoo-logo.png"
               alt="Toronto Zoo Logo"
               class="top-bar-logo"
            >
         </div>

         <!-- Dropdown container -->
         <div class="map-controls">
            <select id="mapPreset">
               <option value="" disabled hidden>Select a map</option>
               <option value="summer">Summer Map</option>
               <option value="winter">Winter Map</option>
               <option value="specific-day" selected>Specific Map</option>
            </select>

            <!-- Date picker only relevant if "Specific Map" is selected -->
            <input type="text" id="mapDate" placeholder="Select a date">
         </div>

         <main class="map-layout">
            <!-- LEFT PANEL: Explore menu -->
            <aside class="side-panel left" aria-label="Explore menu">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">Explore</h2>
               </div>

               <div class="side-panel-body">

                  <!-- Toggle -->
                  <div class="side-panel-toggle">
                     <label class="toggle-row">
                        <input id="showMapLabels" type="checkbox" checked>
                        <span>Show region/pavilion text</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeOffDisplayAnimals" type="checkbox">
                        <span>Include off-display animals</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeSeasonalRestaurants" type="checkbox">
                        <span>Include seasonal restaurants</span>
                     </label>
                  </div>

                  <div class="filter-wrapper">
                     <div class="multi-select" id="typeFilter">
                        <button class="multi-select-button" type="button">
                           <span class="filter-label">Filter:</span>
                           <span class="selected-values"></span>
                        </button>

                        <div class="multi-select-dropdown">
                           <label>
                              <input type="checkbox" value="animal" checked>
                              Animals
                           </label>
                           <label>
                              <input type="checkbox" value="pavilion">
                              Pavilions
                           </label>
                           <label>
                              <input type="checkbox" value="restaurant">
                              Restaurants
                           </label>
                        </div>
                     </div>
                  </div>

                  <!-- Search -->
                  <div class="side-panel-search">
                     <label for="animalSearch" class="sr-only">Search animals</label>
                     <input
                        id="animalSearch"
                        class="animal-search"
                        type="text"
                        placeholder="Search..."
                        autocomplete="off"
                     >
                  </div>

                  <!-- Results -->
                  <div id="animalSearchResults" class="animal-search-results" aria-live="polite"></div>
                  
               </div>

            </aside>

            <!-- MAP -->
            <div class="map-container">
               <div id="mapInner">
                  <img id="zooMap" src="../images/map/zoo_map.png" alt="Toronto Zoo Map">

                  <!-- Static region labels -->
                  <div class="map-label region-label" style="left: 75%; top: 32%;">Eurasia Wilds</div>
                  <div class="map-label region-label" style="left: 64%; top: 44%;">Australasia</div>
                  <div class="map-label region-label" style="left: 53%; top: 26%;">Tundra Trek</div>
                  <div class="map-label region-label" style="left: 48%; top: 39%;">Americas</div>
                  <div class="map-label region-label" style="left: 15%; top: 68%;">Canadian Domain</div>
                  <div class="map-label region-label" style="left: 45%; top: 72%;">Africa</div>
                  <div class="map-label region-label" style="left: 68%; top: 78%;">Indo-Malaya</div>
                  <div class="map-label region-label" style="left: 68%; top: 50%;">Discovery Zone</div>

                  <!-- Static exhibit/pavilion labels -->
                  <div class="map-label exhibit-label" style="left: 65%; top: 41%;">Australasia Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 50%; top: 42.5%;">Americas Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 45%; top: 30%;">Mayan Temple Ruins</div>
                  <div class="map-label exhibit-label" style="left: 53%; top: 75%;">African Rainforest Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 62%; top: 80%;">Indo-Malaya Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 70%; top: 73.5%;">Malayan Woods Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 73%; top: 54%;">Kidz Zoo</div>

                  <!-- markers injected here -->
               </div>

               <div id="tooltip" class="tooltip" style="display:none;"></div>
               <div id="hoverTooltip" class="hover-tooltip" style="display:none;"></div>
            </div>
         </main>

         <div id="speciesOverlay" class="species-overlay hidden">
            <div class="species-overlay-card">
               <button class="species-close">×</button>
               <div class="species-overlay-content"></div>
            </div>
         </div>

         <!-- Bottom navigation menu -->
         <nav>
            <ul>
               <li><a href="map.html">Map</a></li>
               <li><a href="animals.html">Animals</a></li>
               <li><a href="map.html">Itinerary</a></li>
            </ul>
         </nav>
      </div>
   </body>
</html>
