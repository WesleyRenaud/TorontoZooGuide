<!DOCTYPE html>
<html lang="en" class="home-page">
   <head>
      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js" defer></script>

      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
      <title>{{ site.titles.guide }}</title>

      <script type="module" src="../scripts/mainMap.js"></script>
   </head>

   <body>
      <div class="home-page">

         <!-- Top bar with title + logo -->
         <div class="top-bar">
            <span class="top-bar-title">{{ site.titles.guide }}</span>
            <img 
               src="../images/logos/toronto-zoo-logo.png"
               alt="{{ site.logoAlt }}"
               class="top-bar-logo"
            >
         </div>

         <main class="map-layout">
            <!-- LEFT PANEL: Explore menu -->
            <aside class="side-panel left" aria-label="{{ site.map.exploreMenuAria }}">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">{{ site.map.exploreTitle }}</h2>
               </div>

               <div class="side-panel-body">

                  <!-- Toggle -->
                  <div class="side-panel-toggle">
                     <label class="toggle-row">
                        <input id="showMapLabels" type="checkbox" checked>
                        <span>{{ site.map.toggleLabels.showMapLabels }}</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeOffDisplayAnimals" type="checkbox">
                        <span>{{ site.map.toggleLabels.includeOffDisplayAnimals }}</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedRestaurants" type="checkbox">
                        <span>{{ site.map.toggleLabels.includeClosedRestaurants }}</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedRestrooms" type="checkbox">
                        <span>{{ site.map.toggleLabels.includeClosedRestrooms }}</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedGiftShops" type="checkbox">
                        <span>{{ site.map.toggleLabels.includeClosedGiftShops }}</span>
                     </label>

                     <label class="toggle-row">
                        <input id="includeClosedAttractions" type="checkbox">
                        <span>{{ site.map.toggleLabels.includeClosedAttractions }}</span>
                     </label>
                  </div>

                  <div id="transportationRoutes" class="transportation-routes"></div>

                  <div class="filter-wrapper">
                     <div class="multi-select" id="typeFilter">
                        <button class="multi-select-button" type="button">
                           <span class="filter-label">{{ site.map.filterLabel }}</span>
                           <span class="selected-values"></span>
                        </button>

                        <div class="multi-select-dropdown">
                           <label>
                              <input type="checkbox" value="animal" checked>
                              {{ site.nav.animals }}
                           </label>
                           <label>
                              <input type="checkbox" value="pavilion">
                              {{ site.map.filterTypes.pavilion }}
                           </label>
                           <label>
                              <input type="checkbox" value="restaurant">
                              {{ site.map.filterTypes.restaurant }}
                           </label>
                           <label>
                              <input type="checkbox" value="restroom">
                              {{ site.map.filterTypes.restroom }}
                           </label>
                           <label>
                              <input type="checkbox" value="giftShop">
                              {{ site.map.filterTypes.giftShop }}
                           </label>
                           <label>
                              <input type="checkbox" value="attraction">
                              {{ map.filter.attractions }}
                           </label>
                           <label>
                              <input type="checkbox" value="guardiansTalk">
                              {{ site.map.filterTypes.guardiansTalk }}
                           </label>
                           <label>
                              <input type="checkbox" value="wildEncounter">
                              {{ site.nav.wildEncounters }}
                           </label>
                           <label>
                              <input type="checkbox" value="drinkingFountain">
                              {{ site.map.filterTypes.drinkingFountain }}
                           </label>
                           <label>
                              <input type="checkbox" value="defibrillator">
                              {{ site.map.filterTypes.defibrillator }}
                           </label>
                           <label>
                              <input type="checkbox" value="emergencyIntercom">
                              {{ site.map.filterTypes.emergencyIntercom }}
                           </label>
                           <label>
                              <input type="checkbox" value="guestService">
                              {{ site.map.filterTypes.guestService }}
                           </label>
                           <label>
                              <input type="checkbox" value="picnicSite">
                              {{ site.map.filterTypes.picnicSite }}
                           </label>
                           <label>
                              <input type="checkbox" value="eventSite">
                              {{ site.map.filterTypes.eventSite }}
                           </label>
                        </div>
                     </div>
                  </div>

                  <!-- Search -->
                  <div class="side-panel-search">
                     <label for="animalSearch" class="sr-only">{{ site.map.searchAnimals }}</label>
                     <input
                        id="animalSearch"
                        class="animal-search"
                        type="text"
                        placeholder="{{ itinerary.searchPlaceholder }}"
                        autocomplete="off"
                     >
                  </div>

                  <!-- Results -->
                  <div id="animalSearchResults" class="animal-search-results" aria-live="polite"></div>

                  <section class="explore-updates" aria-labelledby="exploreUpdatesTab exploreEventsTab" hidden>
                     <div class="explore-updates-header">
                        <div class="explore-updates-tabs" role="tablist" aria-label="{{ map.updatesAndEvents }}">
                           <button
                              type="button"
                              id="exploreUpdatesTab"
                              class="explore-updates-tab is-active"
                              role="tab"
                              aria-selected="true"
                              aria-controls="exploreUpdatesList"
                           >
                              {{ site.map.updates.title }}
                           </button>
                           <button
                              type="button"
                              id="exploreEventsTab"
                              class="explore-updates-tab"
                              role="tab"
                              aria-selected="false"
                              aria-controls="exploreUpdatesList"
                           >
                              {{ site.map.events.title }}
                           </button>
                        </div>
                        <button
                           type="button"
                           id="exploreUpdatesToggle"
                           class="explore-updates-toggle"
                           aria-controls="exploreUpdatesList"
                           aria-label="{{ map.hideUpdates }}"
                           aria-expanded="true"
                        >
                        </button>
                     </div>
                     <div id="exploreUpdatesList" class="explore-updates-list" aria-live="polite"></div>
                  </section>
               </div>
            </aside>

            <!-- MAP -->
            <div class="map-container">
               <!-- Dropdown container -->
               <div class="map-controls">
                  <select id="mapPreset">
                     <option value="" disabled hidden>{{ site.map.mapPresetPlaceholder }}</option>
                     <option value="summer">{{ site.map.mapPresets.summer }}</option>
                     <option value="winter">{{ site.map.mapPresets.winter }}</option>
                     <option value="specific-day" selected>{{ site.map.mapPresets.specificDay }}</option>
                  </select>

                  <!-- Date picker only relevant if "Specific Map" is selected -->
                  <input type="text" id="mapDate" placeholder="{{ placeholders.date }}">
               </div>

               <div id="mapInner">
                  <div id="zooMapMount" aria-label="{{ site.map.mapAria }}"></div>

                  <!-- markers injected here -->
               </div>

               <div id="tooltip" class="tooltip" style="display:none;"></div>
               <div id="hoverTooltip" class="hover-tooltip" style="display:none;"></div>
            </div>
         </main>

         <div id="speciesOverlay" class="species-overlay hidden">
            <div class="species-overlay-card">
               <button class="species-close"></button>
               <div class="species-overlay-content"></div>
            </div>
         </div>

         <!-- Bottom navigation menu -->
         <nav>
            <ul>
               <li><a href="map.html">{{ site.nav.map }}</a></li>
               <li><a href="animals.html">{{ site.nav.animals }}</a></li>
               <li><a href="https://www.torontozoo.com/meettheguardians">{{ site.nav.meetTheGuardians }}</a></li>
               <li><a href="https://www.torontozoo.com/wildencounters">{{ site.nav.wildEncounters }}</a></li>
               <li><a href="itinerary.html">{{ site.nav.itinerary }}</a></li>
            </ul>
         </nav>
      </div>
   </body>
</html>
