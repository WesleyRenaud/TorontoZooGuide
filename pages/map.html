<!DOCTYPE html>
<html lang="en" class="home-page">
   <head>
      <meta charset="utf-8">
      <title>Toronto Zoo Guide</title>

      <!-- Google Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

      <!-- Stylesheets -->
      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <!-- Scripts -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script src="../scripts/scripts.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.0/build/openseadragon/openseadragon.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>

      <!-- jQuery -->
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   </head>

   <body>
      <div class="home-page">

         <!-- Top bar with title -->
         <div class="top-bar">Toronto Zoo Guide</div>

         <!-- Dropdown container -->
         <div class="map-controls">
            <select id="mapPreset">
               <option value="" selected disabled hidden>Select a map</option>
               <option value="summer">Summer Map</option>
               <option value="winter">Winter Map</option>
               <option value="specific-day">Specific Map</option>
            </select>

            <!-- Date picker only relevant if "Specific Map" is selected -->
            <input type="text" id="mapDate" placeholder="Select a date">
         </div>

         <main class="map-layout">
            <!-- LEFT PANEL: Explore menu -->
            <aside class="side-panel left" aria-label="Explore menu">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">Explore</h2>
               </div>

               <div class="side-panel-body">
               </div>
            </aside>

            <!-- MAP -->
            <div class="map-container">
               <div id="mapInner">
                  <img id="zooMap" src="../images/map/zoo_map.png" alt="Toronto Zoo Map">

                  <!-- Static region labels -->
                  <div class="map-label region-label" style="left: 75%; top: 32%;">Eurasia Wilds</div>
                  <div class="map-label region-label" style="left: 64%; top: 44%;">Australasia</div>
                  <div class="map-label region-label" style="left: 53%; top: 26%;">Tundra Trek</div>
                  <div class="map-label region-label" style="left: 48%; top: 39%;">Americas</div>
                  <div class="map-label region-label" style="left: 15%; top: 68%;">Canadian Domain</div>
                  <div class="map-label region-label" style="left: 45%; top: 72%;">Africa</div>
                  <div class="map-label region-label" style="left: 68%; top: 78%;">Indo-Malaya</div>
                  <div class="map-label region-label" style="left: 68%; top: 50%;">Discovery Zone</div>

                  <!-- Static exhibit/pavilion labels -->
                  <div class="map-label exhibit-label" style="left: 65%; top: 41%;">Australasia Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 50%; top: 42.5%;">Americas Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 45%; top: 30%;">Mayan Temple Ruins</div>
                  <div class="map-label exhibit-label" style="left: 53%; top: 75%;">African Rainforest Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 62%; top: 80%;">Indo-Malaya Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 70%; top: 73.5%;">Malayan Woods Pavilion</div>
                  <div class="map-label exhibit-label" style="left: 73%; top: 54%;">Kidz Zoo</div>

                  <!-- markers injected here -->
               </div>

               <div id="tooltip" class="tooltip" style="display:none;"></div>
            </div>
         </main>

         <div id="speciesOverlay" class="species-overlay hidden">
            <div class="species-overlay-card">
               <button class="species-close">×</button>
               <div class="species-overlay-content"></div>
            </div>
         </div>

         <!-- Bottom navigation menu -->
         <nav>
            <ul>
               <li><a href="map.html">Map</a></li>
               <li><a href="animals.html">Animals</a></li>
               <li><a href="map.html">Itinerary</a></li>
            </ul>
         </nav>
      </div>
   </body>
</html>
