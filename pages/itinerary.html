<!DOCTYPE html>
<html lang="en" class="home-page">
   <head>
      <!-- Stylesheets -->
      <title>{{ site.titles.guide }}</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../styles/styles.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

      <!-- jQuery -->
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

      <!-- Vendor libs -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js" defer></script>

      <!-- Itinerary entry module -->
      <script type="module" src="../scripts/mainItineraryBootstrap.js"></script>
   </head>

   <body>
      <div class="home-page">

         <!-- Top bar -->
         <div class="top-bar">
            <span class="top-bar-title">{{ site.titles.guide }}</span>
            <img
               src="../images/logos/toronto-zoo-logo.png"
               alt="{{ site.logoAlt }}"
               class="top-bar-logo"
            >
         </div>

         <main class="map-layout itinerary-layout">

            <!-- LEFT PANEL: Itinerary -->
            <aside class="side-panel left itinerary-panel" aria-label="{{ itinerary.aria.panel }}">
               <div class="side-panel-header">
                  <h2 class="side-panel-title">{{ site.nav.itinerary }}</h2>
               </div>

               <div class="side-panel-body">
                  <div class="itinerary-empty">
                     {{ itinerary.emptyPanel }}
                  </div>
               </div>
            </aside>

            <!-- MAP -->
            <div class="map-container">
               <div id="mapInner">
                  <div id="zooMapMount" aria-label="{{ map.mapAria }}"></div>
                  
                  <!-- markers injected here -->
               </div>

               <div id="tooltip" class="tooltip" style="display:none;"></div>
               <div id="hoverTooltip" class="hover-tooltip" style="display:none;"></div>

               <!-- Wizard UI mounts here -->
               <div id="itineraryFlow" class="itinerary-flow"></div>

               <button
                  type="button"
                  id="itinerarySettingsGear"
                  class="itinerary-settings-gear"
                  aria-label="{{ itinerary.settings.openAriaLabel }}"
               >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                     <path
                        fill="currentColor"
                        d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.8 8.48a.5.5 0 0 0 .12.64L4.95 10.7c-.04.31-.06.63-.06.94s.02.63.06.94L2.92 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.8c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51.01.64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
                     />
                  </svg>
               </button>
            </div>

         </main>

         <div id="speciesOverlay" class="species-overlay hidden">
            <div class="species-overlay-card">
               <button class="species-close"></button>
               <div class="species-overlay-content"></div>
            </div>
         </div>

         <!-- Bottom navigation -->
         <nav>
            <ul>
               <li><a href="map.html">{{ site.nav.map }}</a></li>
               <li><a href="animals.html">{{ site.nav.animals }}</a></li>
               <li><a href="https://www.torontozoo.com/meettheguardians">{{ site.nav.meetTheGuardians }}</a></li>
               <li><a href="https://www.torontozoo.com/wildencounters">{{ site.nav.wildEncounters }}</a></li>
               <li><a href="itinerary.html">{{ site.nav.itinerary }}</a></li>
            </ul>
         </nav>

      </div>
   </body>
</html>
