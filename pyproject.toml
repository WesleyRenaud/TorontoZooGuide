[tool.coverage.run]
source = [ "api" ]
omit = [
   "api/__main__.py",
   "api/**/__init__.py",
   "api/server_runner.py",
]

[tool.ruff]
target-version = "py311"
exclude = [
   ".git",
   ".vscode",
   "__pycache__",
   "images",
   "node_modules",
   ".venv"
]

[tool.ruff.lint]
select = [
   "F841",
   "W293",
   "ANN001",
   "ANN201",
   "ANN202",
   "ANN204",
   "ANN205",
   "ANN206"
]
ignore = [
   "ANN401"
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.tzg_python_style]
blank_lines_between_methods = 2
enforce_typing = true
exclude = [
   "scripts/capture_readme_screenshots.py",
   "api/seed/tables/animal_seed_table.py",
   "api/zoo.py"
]
tuple_dict_key_exclude = [
   "api/guardians/itinerary/itinerary_guardians_talks_builder.py",
   "api/itinerary/domain/itinerary_transportation_animal_visibility_filter.py",
   "api/itinerary/validation/selected_exhibit_date_change_animals_builder.py",
   "api/transportation/data_access/transportation_route_leg_marker_provider.py",
   "tests/api/itinerary/scheduling/bulk/loop_unit_attraction_hours_scheduler_tests.py",
   "tests/api/seed/static_data_seeder_tests.py",
   "tests/tools/checks/animal_closure_off_display_extension_checker_tests.py",
   "tools/checks/viewing_hours_plan.py",
]

[tool.tzg_python_one_class_per_file]
include = [
   "api/**/*.py",
   "tools/checks/**/*.py",
   "tools/fix/**/*.py",
]

[tool.tzg_python_namespace_style]
include = [
   "api/**/*.py",
   "tests/**/*.py",
   "tools/checks/**/*.py",
   "tools/fix/**/*.py",
]

[tool.tzg_python_unit_tests]
include = [
   "tests/api/**/*.py",
   "tests/tools/**/*.py",
]
exclude = [
   "tests/api/api_test_support/**",
]

[tool.pytest.ini_options]
python_files = [ "*_tests.py", "test_*.py" ]
python_functions = [ "Test_*", "test_*" ]
pythonpath = [ "tests/api" ]
testpaths = [ "tests/api", "tests/tools" ]
addopts = [ "--import-mode=importlib" ]
