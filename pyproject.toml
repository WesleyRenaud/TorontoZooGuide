[tool.coverage.run]
omit = [
   "api/__main__.py",
   "api/seed/clear_user_itinerary_config.py",
   "api/seed/clear_user_itinerary_data.py",
   "api/seed/create_schema.py",
   "api/seed/seed_data.py",
   "api/seed/migrations/runner.py",
]

[tool.ruff]
target-version = "py311"
exclude = [
   ".git",
   ".vscode",
   "__pycache__",
   "images",
   "node_modules",
   ".venv"
]

[tool.ruff.lint]
select = [
   "F841",
   "W293",
   "ANN001",
   "ANN201",
   "ANN202",
   "ANN204",
   "ANN205",
   "ANN206"
]
ignore = [
   "ANN401"
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.tzg_python_style]
blank_lines_between_methods = 2
enforce_typing = true
exclude = [
   "scripts/capture_readme_screenshots.py",
   "api/seed/tables/animal.py",
   "api/zoo.py"
]
