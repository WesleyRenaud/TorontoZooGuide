[tool.coverage.run]
# TODO(api-test-migration): When tests/backend is removed and tests/api covers all API
# modules, drop the per-module source list below and measure --cov=api instead.
# Also remove the per-module --cov flags from package.json coverage:py.
source = [
   "api/animals",
   "api/attractions",
   "api/exhibits",
   "api/giftshops",
   "api/restaurants",
   "api/restrooms",
]
omit = [
   "api/__main__.py",
   "api/seed/**",
   "api/**/coordinators/**",
   "api/**/data_access/**",
   "api/**/*_routes.py",
   "api/**/__init__.py",
   "api/models/**",
   "api/**/itinerary/**",
   "api/**/scheduling/*_conflict_resolver.py",
   "api/**/scheduling/*_time_bounds_builder.py",
]

[tool.ruff]
target-version = "py311"
exclude = [
   ".git",
   ".vscode",
   "__pycache__",
   "images",
   "node_modules",
   ".venv"
]

[tool.ruff.lint]
select = [
   "F841",
   "W293",
   "ANN001",
   "ANN201",
   "ANN202",
   "ANN204",
   "ANN205",
   "ANN206"
]
ignore = [
   "ANN401"
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.tzg_python_style]
blank_lines_between_methods = 2
enforce_typing = true
exclude = [
   "scripts/capture_readme_screenshots.py",
   "api/seed/tables/animal_seed_table.py",
   "api/zoo.py"
]

[tool.tzg_python_one_class_per_file]
include = [
   "api/**/*.py",
]

[tool.pytest.ini_options]
python_files = [ "*_tests.py", "test_*.py" ]
python_functions = [ "Test_*", "test_*" ]
pythonpath = [ "tests/api" ]
testpaths = [ "tests/api", "tests/backend" ]
