name: Daily check

on:
  schedule:
    # 11:00 UTC is 6:00 AM Eastern Standard Time and 7:00 AM Eastern Daylight Time.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix and email the summary
        id: website_check
        env:
          CHECK_EMAIL_PASSWORD: ${{ secrets.CHECK_EMAIL_PASSWORD }}
        run: |
          set +e
          python3 -m tools.fix
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Save the database fixes
        if: steps.website_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- animals.db; then
            exit 0
          fi

          branch="tools/daily-check-database-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -- animals.db
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Apply the daily check fixes to the animal database."
          git push -u origin HEAD
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Apply the daily check fixes to the animal database" \
            --body "The daily check updated animals.db. This pull request saves those fixes."
          gh pr merge "$branch" --merge --delete-branch

      - name: Fail when issues remain
        if: always() && steps.website_check.outputs.exit_code != '0'
        run: exit 1
