name: Daily check

on:
  workflow_dispatch:
  # cron.surf: 0 6 * * * America/Toronto
  schedule:
    # Backup. GitHub often starts this hours after 6:00 AM Toronto time.
    # It does nothing when the 6:00 AM run has already happened.
    - cron: '0 11 * * *'

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Skip when a check already started today
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! runs=$(gh run list --workflow daily-check.yml --limit 30 --json databaseId,conclusion,createdAt,status); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! decision=$(TODAY="$(TZ=America/Toronto date +%F)" RUNS="$runs" python3 -c 'import textwrap; exec(textwrap.dedent("""
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("America/Toronto")
          today = os.environ["TODAY"]
          current = int(os.environ["GITHUB_RUN_ID"])
          active = {"queued", "in_progress", "waiting", "pending", "requested"}

          for run in json.loads(os.environ["RUNS"]):
              if run["databaseId"] == current:
                  continue

              created = datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00")).astimezone(zone)

              if created.date().isoformat() != today:
                  continue

              if run["status"] in active or run["conclusion"] == "success":
                  print("false")
                  break
          else:
              print("true")
          """))'); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$decision" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix and email the summary
        id: website_check
        if: steps.gate.outputs.run == 'true'
        env:
          CHECK_EMAIL_PASSWORD: ${{ secrets.CHECK_EMAIL_PASSWORD }}
        run: |
          set +e
          python3 -m tools.fix
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Save the database fixes
        if: steps.gate.outputs.run == 'true' && steps.website_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- animals.db; then
            exit 0
          fi

          branch="tools/daily-check-database-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -- animals.db
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Apply the daily check fixes to the animal database."
          git push -u origin HEAD
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Apply the daily check fixes to the animal database" \
            --body "The daily check updated animals.db. This pull request saves those fixes."
          gh pr merge "$branch" --merge --delete-branch

      - name: Fail when issues remain
        if: steps.gate.outputs.run == 'true' && steps.website_check.outputs.exit_code != '0'
        run: exit 1
