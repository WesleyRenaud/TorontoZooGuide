name: Daily check

on:
  schedule:
    # 11:00 UTC is 6:00 AM Eastern Standard Time and 7:00 AM Eastern Daylight Time.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check
        id: website_check
        run: |
          set +e
          python3 -m tools.scheduleCheck > check-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Email the summary
        env:
          CHECK_EMAIL_PASSWORD: ${{ secrets.CHECK_EMAIL_PASSWORD }}
        run: >
          python3 -m tools.emailCheckSummary
          --output check-output.txt
          --exit-code "${{ steps.website_check.outputs.exit_code }}"

      - name: Fail when the check reported issues
        if: always() && steps.website_check.outputs.exit_code != '0'
        run: exit 1
