<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Manual test runner — Toronto Zoo Guide</title>
   <style>
:root {
   --mt-bg: #eef1ea;
   --mt-panel: #f7f8f4;
   --mt-ink: #1c2420;
   --mt-muted: #5c6b63;
   --mt-line: #c5cec4;
   --mt-accent: #3d5c45;
   --mt-pass: #2f6b3a;
   --mt-fail: #9b2f2f;
   --mt-blocked: #6b5a2f;
   --mt-pass-bg: #d9eadc;
   --mt-fail-bg: #f3d6d6;
   --mt-blocked-bg: #efe6c9;
}
* { box-sizing: border-box; }
body {
   margin: 0;
   min-height: 100vh;
   font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
   color: var(--mt-ink);
   background:
      radial-gradient(circle at top left, #dfe8d8 0%, transparent 42%),
      linear-gradient(180deg, #f4f6f1 0%, var(--mt-bg) 100%);
}
.top {
   display: flex;
   justify-content: space-between;
   gap: 1.5rem;
   align-items: end;
   padding: 1.25rem 1.5rem;
   border-bottom: 1px solid var(--mt-line);
   background: rgba(247, 248, 244, 0.92);
}
.kicker {
   margin: 0 0 0.2rem;
   text-transform: uppercase;
   letter-spacing: 0.08em;
   font-size: 0.75rem;
   color: var(--mt-muted);
}
.top h1 {
   margin: 0;
   font-size: 1.6rem;
   font-weight: 650;
}
.status {
   margin: 0;
   max-width: 28rem;
   color: var(--mt-muted);
   font-size: 0.95rem;
}
.layout {
   display: grid;
   grid-template-columns: minmax(14rem, 20rem) 1fr;
   min-height: calc(100vh - 5.5rem);
}
.nav {
   padding: 1rem 1rem 2rem;
   border-right: 1px solid var(--mt-line);
   background: var(--mt-panel);
   overflow: auto;
}
.nav h2 {
   margin: 1rem 0 0.4rem;
   font-size: 0.8rem;
   text-transform: uppercase;
   letter-spacing: 0.06em;
   color: var(--mt-muted);
}
.suite-list {
   list-style: none;
   margin: 0;
   padding: 0;
}
.suite-link {
   width: 100%;
   text-align: left;
   border: 1px solid transparent;
   background: transparent;
   color: inherit;
   border-radius: 0.45rem;
   padding: 0.45rem 0.55rem;
   margin-bottom: 0.2rem;
   cursor: pointer;
   font: inherit;
}
.suite-link:hover { background: #e7ece3; }
.suite-link.is-active {
   border-color: var(--mt-accent);
   background: #e2ebdf;
}
.suite-link.is-partial { box-shadow: inset 3px 0 0 var(--mt-blocked); }
.suite-link.is-failed { box-shadow: inset 3px 0 0 var(--mt-fail); }
.suite-link.is-complete { box-shadow: inset 3px 0 0 var(--mt-pass); }
.main {
   padding: 1.25rem 1.5rem 3rem;
   overflow: auto;
}
.suite-header h1 {
   margin: 0 0 0.75rem;
   font-size: 1.45rem;
}
.suite-header p {
   margin: 0.35rem 0;
   line-height: 1.45;
}
.actions {
   display: flex;
   flex-wrap: wrap;
   gap: 0.5rem;
   margin: 1rem 0 0.5rem;
}
.actions button,
.result-btn {
   font: inherit;
   cursor: pointer;
}
.actions button {
   border: 1px solid var(--mt-line);
   background: #fff;
   border-radius: 0.4rem;
   padding: 0.4rem 0.7rem;
}
.summary {
   margin: 0 0 1rem;
   color: var(--mt-muted);
}
.step {
   background: #fff;
   border: 1px solid var(--mt-line);
   border-radius: 0.65rem;
   padding: 0.9rem 1rem 1rem;
   margin-bottom: 0.75rem;
}
.step h2 {
   margin: 0 0 0.55rem;
   font-size: 1.05rem;
}
.step p {
   margin: 0.35rem 0;
   line-height: 1.45;
}
.step.result-pass {
   background: var(--mt-pass-bg);
   border-color: #b7d4bc;
}
.step.result-fail {
   background: var(--mt-fail-bg);
   border-color: #e0b4b4;
}
.step.result-blocked {
   background: var(--mt-blocked-bg);
   border-color: #ddd0a6;
}
.result-row {
   display: flex;
   align-items: center;
   gap: 0.45rem;
   margin: 0.75rem 0 0.5rem;
}
.result-label {
   font-weight: 650;
   margin-right: 0.25rem;
}
.result-btn {
   width: 2.35rem;
   height: 2.35rem;
   border-radius: 999px;
   border: 1.5px solid var(--mt-line);
   background: #fff;
   font-size: 1.15rem;
   line-height: 1;
}
.result-btn.result-pass[aria-pressed="true"] {
   background: var(--mt-pass);
   border-color: var(--mt-pass);
   color: #fff;
}
.result-btn.result-fail[aria-pressed="true"] {
   background: var(--mt-fail);
   border-color: var(--mt-fail);
   color: #fff;
}
.result-btn.result-blocked[aria-pressed="true"] {
   background: var(--mt-blocked);
   border-color: var(--mt-blocked);
   color: #fff;
}
.notes-label {
   display: grid;
   gap: 0.3rem;
   font-weight: 650;
   margin-top: 0.35rem;
}
.notes {
   width: 100%;
   font: inherit;
   border: 1px solid var(--mt-line);
   border-radius: 0.4rem;
   padding: 0.45rem 0.55rem;
   resize: vertical;
   background: rgba(255, 255, 255, 0.85);
}
@media (max-width: 840px) {
   .layout { grid-template-columns: 1fr; }
   .nav {
      border-right: 0;
      border-bottom: 1px solid var(--mt-line);
      max-height: 14rem;
   }
   .top {
      flex-direction: column;
      align-items: start;
   }
}
   </style>
</head>
<body>
   <header class="top">
      <div>
         <p class="kicker">Toronto Zoo Guide</p>
         <h1>Manual test runner</h1>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
   </header>
   <div class="layout">
      <nav id="nav" class="nav" aria-label="Test suites"></nav>
      <main id="main" class="main"></main>
   </div>
   <script>
window.__SUITES__ = [{"id":"MAP-01","title":"Baseline load and chrome","preconditions":"`npm run seed`, `npm start`, browser DevTools console open. Open `http://localhost:8000/map.html`.","dateUnderTest":"Default **Specific Map** (whatever date the picker shows after load).","cleanup":"None.","steps":[{"number":1,"name":"Open map page","do":"Navigate to `map.html`.","expect":"Page loads; zoo map SVG appears in the map mount; no hard failure / blank page."},{"number":2,"name":"Check browser console","do":"Inspect the DevTools console for load errors.","expect":"No uncaught errors related to map SVG, markers, or bootstrap (benign 3rd-party noise OK — note it)."},{"number":3,"name":"Explore panel visible","do":"Look at the left **Explore** panel.","expect":"Panel titled **Explore** is visible with toggles, Filter, and search."},{"number":4,"name":"Bottom nav links","do":"Inspect the bottom nav.","expect":"Links include **Map**, **Animals**, Meet the Guardians (external), Wild Encounters (external), and **Itinerary**."},{"number":5,"name":"Pan map","do":"Click-drag the map canvas.","expect":"Map pans; markers move with the map."},{"number":6,"name":"Zoom map","do":"Zoom in and out (scroll/pinch/controls as available).","expect":"Map zooms; markers remain attached to locations."},{"number":7,"name":"Show region/pavilion text on","do":"Enable **Show region/pavilion text** if it is not already on (it may default checked).","expect":"Region/pavilion labels appear on the map."},{"number":8,"name":"Show region/pavilion text off","do":"Disable **Show region/pavilion text**.","expect":"Those labels hide again."},{"number":9,"name":"Default animal markers","do":"With default filters (Animals checked), observe the map.","expect":"Animal markers are visible on **Specific Map**; map mount is not empty/broken."}],"group":"map"},{"id":"MAP-02","title":"Date presets","preconditions":"MAP-01 baseline OK. Open `map.html`.","dateUnderTest":"Exercise **Summer Map**, **Winter Map**, and **Specific Map**.","cleanup":"Leave preset on **Specific Map** when finished.","steps":[{"number":1,"name":"Select Summer Map","do":"In the map controls dropdown, choose **Summer Map**.","expect":"Preset switches to **Summer Map**."},{"number":2,"name":"Summer date control","do":"Observe `#mapDate` / date field.","expect":"Date input is hidden or not used for free picking (summer uses fixed seasonal anchor)."},{"number":3,"name":"Summer markers context","do":"Note animal/amenity marker set and Explore **Updates** if shown.","expect":"Map content reflects summer context (differs from mid-winter where species/amenities are seasonal)."},{"number":4,"name":"Select Winter Map","do":"Choose **Winter Map**.","expect":"Preset switches to **Winter Map**."},{"number":5,"name":"Winter date control","do":"Observe the date field again.","expect":"Date picking stays locked/hidden as designed for winter preset."},{"number":6,"name":"Winter vs summer difference","do":"Compare markers/Updates to what you saw on Summer Map.","expect":"At least some seasonal difference is visible (animals, closed exhibits, updates, or Zoomobile season) — note what changed."},{"number":7,"name":"Select Specific Map","do":"Choose **Specific Map**.","expect":"Preset switches; date field becomes available."},{"number":8,"name":"Open date picker","do":"Click the date input.","expect":"Flatpickr (or date UI) opens."},{"number":9,"name":"Pick mid-season date","do":"Choose a mid-season date (e.g. a day in May or September).","expect":"Date applies; map refetches."},{"number":10,"name":"Refresh for that date","do":"Watch markers and Updates/Events after the date change.","expect":"Markers and Updates/Events refresh for the selected date without requiring a full page reload."}],"group":"map"},{"id":"MAP-03","title":"Type filters and search","preconditions":"Open `map.html` on **Specific Map**. Pick a known seed animal (e.g. **African Lion** or **Raccoon**).","dateUnderTest":"Any Specific Map date where the chosen animal is in seed.","cleanup":"Re-check **Animals** in Filter before leaving.","steps":[{"number":1,"name":"Animals checked by default","do":"Open **Filter:** dropdown.","expect":"**Animals** checkbox is checked; other types are unchecked by default."},{"number":2,"name":"Uncheck Animals","do":"Uncheck **Animals**.","expect":"Animal markers disappear from the map."},{"number":3,"name":"Recheck Animals","do":"Check **Animals** again.","expect":"Animal markers return."},{"number":4,"name":"Enable Restaurants","do":"Check **Restaurants**.","expect":"Restaurant markers appear (in addition to animals)."},{"number":5,"name":"Disable Restaurants","do":"Uncheck **Restaurants**.","expect":"Restaurant markers hide; animals remain."},{"number":6,"name":"Spot-check another type","do":"Briefly enable **Pavilions** or **Attractions**, then disable.","expect":"Corresponding markers show/hide without breaking Animals."},{"number":7,"name":"Search query","do":"In **Search animals** / Search… field, type part of the known species name.","expect":"Results list under the search field populates."},{"number":8,"name":"Select search result","do":"Click a search result.","expect":"Map pans/focuses to that animal’s marker."},{"number":9,"name":"Focus feedback","do":"Observe tooltip or highlight after selection.","expect":"Click tooltip and/or focus styling appears for the target."},{"number":10,"name":"Clear via uncheck Animals","do":"Uncheck **Animals** while search results are visible.","expect":"Search results clear or animal results are removed as designed."},{"number":11,"name":"Restore search","do":"Recheck **Animals** and search again.","expect":"Search works again and can focus a marker."}],"group":"map"},{"id":"MAP-04","title":"Markers, likelihood, stacks","preconditions":"Open `map.html` on **Specific Map**. Prefer a shoulder-season date (e.g. late March or November) for mixed likelihood tints.","dateUnderTest":"Record the Specific Map date used.","cleanup":"None.","steps":[{"number":1,"name":"Pick mixed-likelihood date","do":"Set Specific Map to a shoulder-season date.","expect":"Date applies; markers reload."},{"number":2,"name":"Likelihood tint","do":"Compare an animal icon tint to a peak-summer date for the same species (toggle date).","expect":"Tint/likelihood styling differs where the seasonal curve is not flat — note species checked."},{"number":3,"name":"Find stack or skip","do":"Look for a stacked/count marker at shared coordinates.","expect":"If none in seed: **Blocked** — stacking covered when shared coords exist; continue other steps."},{"number":4,"name":"Click stack","do":"Click a stacked marker (if present).","expect":"Multi-item UI / carousel appears."},{"number":5,"name":"Carousel UI","do":"Confirm multiple items are listed or carouseled.","expect":"More than one entity is represented."},{"number":6,"name":"Advance carousel","do":"Use next/prev on the carousel if present.","expect":"Each item becomes identifiable (name/type)."},{"number":7,"name":"Amenity styling spot-check","do":"Enable **Restaurants** or **Gift Shops** or **Attractions**; spot-check open/closed or likelihood styling.","expect":"Markers render with expected open/closed or likelihood treatment."},{"number":8,"name":"Limited-viewing / alert badge","do":"If seed has limited viewing or alerts, find `marker-has-limited-viewing` / badge styling.","expect":"Badge visible if data exists; else **Blocked** → CON-02/CON-03."},{"number":9,"name":"Zoom stability","do":"Zoom in/out around markers.","expect":"Markers stay anchored; not orphaned off-map incorrectly."},{"number":10,"name":"Return to Specific Map","do":"Leave a mid-season Specific Map date selected.","expect":"Map remains usable."}],"group":"map"},{"id":"MAP-05","title":"Tooltips and species overlay","preconditions":"Animals filter on. Know a searchable species (e.g. **African Lion**).","dateUnderTest":"Specific Map date where the species is shown.","cleanup":"Close any open overlay/tooltip.","steps":[{"number":1,"name":"Hover tooltip","do":"Hover an animal marker.","expect":"Hover tooltip (`#hoverTooltip`) appears with identifying text."},{"number":2,"name":"Click tooltip","do":"Click the animal marker.","expect":"Click tooltip (`#tooltip`) opens."},{"number":3,"name":"Tooltip essentials","do":"Read the click tooltip.","expect":"Shows species name and exhibit/essentials (likelihood line may appear)."},{"number":4,"name":"More Info","do":"Click **More Info** (or equivalent) from the tooltip.","expect":"Species overlay (`#speciesOverlay`) opens."},{"number":5,"name":"Overlay content","do":"Inspect overlay content.","expect":"Detail content loads (not blank/error-only)."},{"number":6,"name":"Close overlay","do":"Click the overlay close control.","expect":"Overlay hides."},{"number":7,"name":"Amenity or pavilion tooltip","do":"Enable **Restaurants** or **Pavilions**; click a non-animal marker.","expect":"Type-appropriate tooltip appears."},{"number":8,"name":"Dismiss tooltip","do":"Click empty map or dismiss control.","expect":"Tooltip closes."},{"number":9,"name":"Replace tooltip","do":"Quickly click another marker.","expect":"Tooltip content switches cleanly to the new target."},{"number":10,"name":"Hover after click","do":"Hover a different marker after dismissing click tooltip.","expect":"Hover tooltip still works."}],"group":"map"},{"id":"MAP-06","title":"Off-display and closed include toggles","preconditions":"Self-contained: use Specific Map dates where seed already yields off-display animals or closed amenities. **Do not use console.** If unreachable, mark steps **Blocked** → CON-01 / CON-05 / CON-06 / CON-07 / CON-08.","dateUnderTest":"Record date(s) attempted.","cleanup":"Leave include toggles unchecked.","steps":[{"number":1,"name":"Baseline","do":"Note marker set with all include-* toggles off.","expect":"Baseline recorded."},{"number":2,"name":"Include off display animals on","do":"Enable **Include off display animals**.","expect":"Additional animals and/or off-display banners appear **or** Blocked if seed has none for this date."},{"number":3,"name":"Off-display feedback","do":"If animals appeared, inspect tooltip/banner.","expect":"Off-display messaging present."},{"number":4,"name":"Include off display off","do":"Disable the toggle.","expect":"Those animals hide again."},{"number":5,"name":"Include closed restaurants","do":"Enable **Include closed restaurants**.","expect":"Closed restaurants appear **or** Blocked."},{"number":6,"name":"Restaurants off","do":"Disable **Include closed restaurants**.","expect":"Extra closed restaurants hide."},{"number":7,"name":"Include closed restrooms","do":"Enable then disable **Include closed restrooms**.","expect":"Show/hide works **or** Blocked."},{"number":8,"name":"Include closed gift shops","do":"Enable then disable **Include closed gift shops**.","expect":"Show/hide works **or** Blocked."},{"number":9,"name":"Include closed attractions","do":"Enable then disable **Include closed attractions**.","expect":"Show/hide works **or** Blocked."},{"number":10,"name":"Banner readability","do":"With any include toggle that shows banners, read banner text.","expect":"Banners readable; layout not fully broken."},{"number":11,"name":"No console used","do":"Confirm this suite did not open console-operations.","expect":"Self-contained requirement met."},{"number":12,"name":"Reset toggles","do":"Uncheck all include-* toggles.","expect":"Map back to default inclusion behavior."}],"group":"map"},{"id":"MAP-07","title":"Zoomobile routes","preconditions":"Explore panel visible with transportation route radios.","dateUnderTest":"Specific Map (or Current route season).","cleanup":"Set route control back to **None**.","steps":[{"number":1,"name":"None","do":"Select **None** under Zoomobile/transportation routes.","expect":"No Zoomobile route SVG/arrows shown."},{"number":2,"name":"Current Route","do":"Select **Current Route**.","expect":"Route and/or stations appear per current season rules."},{"number":3,"name":"Summer Route","do":"Select **Summer Route** (or summer-style option).","expect":"Summer route layer/markers visible."},{"number":4,"name":"Winter Route","do":"Select **Winter Route**.","expect":"Winter route layer/markers visible; differs from summer where designed."},{"number":5,"name":"Station tooltip","do":"Click a Zoomobile station marker.","expect":"Tooltip shows station info (e.g. Zoomobile Station naming)."},{"number":6,"name":"Back to None","do":"Select **None** again.","expect":"Route layers clear."},{"number":7,"name":"Animals still present","do":"Confirm **Animals** still checked.","expect":"Animal markers still present."},{"number":8,"name":"No leftover arrows","do":"Pan around former route areas.","expect":"No orphaned route arrows/markers left behind."},{"number":9,"name":"Repeat Current once","do":"Toggle Current → None once more.","expect":"Still cleans up reliably."}],"group":"map"},{"id":"MAP-08","title":"Closed exhibits and Updates/Events","preconditions":"Specific Map. Seed may include updates/events; closed exhibits may be Blocked → CON-04 / CON-13 / CON-14.","dateUnderTest":"Record Specific Map date; also change date mid-suite.","cleanup":"None.","steps":[{"number":1,"name":"Updates tab","do":"In Explore, open **Updates** (under Updates and events).","expect":"Tab selected; list or empty state shown."},{"number":2,"name":"Updates content sanity","do":"Read empty state or update cards.","expect":"Sane content; no crash."},{"number":3,"name":"Collapse/expand","do":"Use show/hide updates control (**Hide updates and events** / **Show updates and events**).","expect":"Section collapses and expands."},{"number":4,"name":"Updates carousel","do":"If multiple updates, use previous/next update controls.","expect":"Carousel advances **or** N/A if only one/none."},{"number":5,"name":"Events tab","do":"Select **Events**.","expect":"Events list or empty state shown."},{"number":6,"name":"Events content sanity","do":"Read events content.","expect":"Sane empty/full state."},{"number":7,"name":"Change map date","do":"On Specific Map, change the date.","expect":"Date applies."},{"number":8,"name":"Updates/Events refresh","do":"Recheck Updates and Events after date change.","expect":"Content refreshes for the new date."},{"number":9,"name":"Closed exhibit overlay","do":"If a closed exhibit exists for the date, find overlay.","expect":"Overlay visible **or** Blocked → CON-04."},{"number":10,"name":"Open date without overlay","do":"Pick a date without closure (or after noting Blocked).","expect":"No erroneous full-map closed overlay."}],"group":"map"},{"id":"MAP-09","title":"Deep link focus","preconditions":"Know a seed species (+ optional exhibit), e.g. `African Lion` / Africa Savanna. URL-encode spaces as needed.","dateUnderTest":"N/A (focus query).","cleanup":"End on plain `map.html` without query.","steps":[{"number":1,"name":"Open focus URL","do":"Open `map.html?focus=African%20Lion` (adjust species) and optional `&exhibit=...`.","expect":"Page loads and attempts focus."},{"number":2,"name":"Pan/focus target","do":"Observe map motion/highlight.","expect":"Map pans/focuses toward the target marker."},{"number":3,"name":"Filter includes Animals","do":"Check Filter.","expect":"**Animals** is checked (auto-added if needed)."},{"number":4,"name":"Tooltip or highlight","do":"Observe target marker.","expect":"Tooltip and/or highlight on the focused animal."},{"number":5,"name":"Query stripped","do":"Inspect the address bar after focus completes.","expect":"Focus query params removed via history replace."},{"number":6,"name":"Refresh clean","do":"Reload the cleaned URL.","expect":"Normal map load without forced focus."},{"number":7,"name":"Invalid focus","do":"Open `map.html?focus=NotARealSpecies123`.","expect":"Fails gracefully (no crash); map still usable."},{"number":8,"name":"Bottom nav after focus","do":"Use bottom nav to Itinerary then back to Map.","expect":"Navigation still works."}],"group":"map"},{"id":"MAP-10","title":"Narrow layout smoke","preconditions":"Open `map.html`. Use DevTools responsive mode ≈720px width (or slightly below).","dateUnderTest":"Specific Map.","cleanup":"Restore desktop width.","steps":[{"number":1,"name":"Resize","do":"Set viewport width to ~720px.","expect":"Layout reflows; page still loads."},{"number":2,"name":"Explore usable","do":"Scroll/interact with Explore.","expect":"Explore is usable or scrollable (not completely inaccessible)."},{"number":3,"name":"Banners","do":"If banners show, read them.","expect":"Banners stack/readable at narrow width."},{"number":4,"name":"Tooltip not off-screen","do":"Click an animal marker.","expect":"Tooltip mostly on-screen / usable."},{"number":5,"name":"Search usable","do":"Use animal search.","expect":"Can type and see results."},{"number":6,"name":"Pan/zoom","do":"Pan and zoom the map.","expect":"Still works."},{"number":7,"name":"Date preset control","do":"Change map preset or date.","expect":"Controls remain usable."},{"number":8,"name":"Restore desktop","do":"Return to a wide viewport.","expect":"Layout recovers without requiring reload (note if reload needed)."}],"group":"map"},{"id":"ITIN-01","title":"Wizard happy path","preconditions":"`npm run clear:itinerary` if needed. Open `itinerary.html`. Prefer a future in-season visit date with animals offered.","dateUnderTest":"Chosen future visit date (record it).","cleanup":"`npm run clear:itinerary` or **Clear Itinerary?** when done.","steps":[{"number":1,"name":"Open itinerary","do":"Open `itinerary.html`. Use **Edit Itinerary** / **Build Itinerary** to open the builder if needed.","expect":"Itinerary page loads; builder can be opened."},{"number":2,"name":"Set Visit Date","do":"Complete **Set Visit Date** and continue.","expect":"Date is accepted; next wizard step appears."},{"number":3,"name":"Add Animals by Region","do":"On **Add Animals by Region**, select at least one region/exhibit and continue.","expect":"Selection is kept; proceed to animals."},{"number":4,"name":"Add Animals","do":"On **Add Animals**, add ≥1 animal.","expect":"Animal appears selected in the builder."},{"number":5,"name":"Add Attractions","do":"On **Add Attractions**, add 0 or 1 attraction and continue.","expect":"Step completes (empty OK)."},{"number":6,"name":"Meet the Guardians","do":"On the Meet the Guardians step, add a talk if listed, else continue.","expect":"Pass with Notes “none offered” if empty for the date."},{"number":7,"name":"Wild Encounters","do":"On **Wild Encounters**, add one if listed, else continue.","expect":"Pass with Notes “none offered” if empty."},{"number":8,"name":"Add Transportation","do":"On **Add Transportation**, add or skip, then continue toward finish.","expect":"Step completes."},{"number":9,"name":"Finish with items","do":"Click **Finish** with ≥1 total selected item.","expect":"Finish succeeds (not **No Items Selected**)."},{"number":10,"name":"List view","do":"Click **List View** and confirm sections.","expect":"Sections show selected animals (and other types if chosen); **List View** control is available."},{"number":11,"name":"Day Planner view","do":"Switch to **Day Planner View** if not already shown.","expect":"Day Planner / timeline UI is available (**Arrival time**, **Departure time**, scheduled/unscheduled sections)."},{"number":12,"name":"Map pane markers","do":"Look at the itinerary map pane.","expect":"Planned item markers appear on the map."}],"group":"itinerary"},{"id":"ITIN-02","title":"Empty finish and clear","preconditions":"Clear any existing itinerary. Open `itinerary.html`.","dateUnderTest":"Any valid future date.","cleanup":"End with empty itinerary.","steps":[{"number":1,"name":"Open builder with no items","do":"Start the wizard and advance through steps without selecting animals/attractions/talks/encounters/transport.","expect":"Wizard allows advancing with empty selections."},{"number":2,"name":"Finish empty","do":"Click **Finish**.","expect":"**No Items Selected** (or equivalent) blocks a successful empty itinerary."},{"number":3,"name":"Acknowledge empty state","do":"Dismiss the empty-finish message.","expect":"Back in builder; can still edit."},{"number":4,"name":"Add one animal","do":"Add ≥1 animal on **Add Animals**.","expect":"Animal is selected."},{"number":5,"name":"Finish with item","do":"Click **Finish**.","expect":"Itinerary saves/builds successfully."},{"number":6,"name":"Clear itinerary","do":"Click **Clear**.","expect":"**Clear Itinerary?** confirmation appears with the remove-all message."},{"number":7,"name":"Confirm clear","do":"Confirm the clear.","expect":"Itinerary returns to empty state."},{"number":8,"name":"Wizard usable again","do":"Open **Edit Itinerary** / **Build Itinerary** again.","expect":"Wizard starts cleanly (e.g. **Set Visit Date**)."}],"group":"itinerary"},{"id":"ITIN-03","title":"Arrival, departure, early admission","preconditions":"Saved itinerary with ≥1 item (ITIN-01). Open Day Planner / time controls.","dateUnderTest":"Itinerary visit date.","cleanup":"Leave valid arrival/departure; Early Admission off unless you intend otherwise.","steps":[{"number":1,"name":"Valid times","do":"Set a sensible arrival before departure.","expect":"Times accepted; no blocking validation."},{"number":2,"name":"Invalid order","do":"Set departure before arrival.","expect":"Validation bubble/error on arrival/departure."},{"number":3,"name":"Short visit","do":"Set arrival and departure equal or nearly equal.","expect":"Short-visit handling appears (message or constraint) — note behavior."},{"number":4,"name":"Fix window","do":"Restore a valid multi-hour window.","expect":"Validation clears; schedule usable."},{"number":5,"name":"Enable Early Admission","do":"Turn on **Early Admission**.","expect":"**Early Admission Hours** / membership-sensory confirmation appears."},{"number":6,"name":"Cancel early admission","do":"Cancel/dismiss the confirmation.","expect":"Early Admission not applied (or reverts) — note."},{"number e":"Map open state","do":"Map on D.","expect":"Attraction appears open/normal without needing include-closed."},{"number":11,"name":"Hours still valid","do":"Spot-check itinerary scheduling still respects hours.","expect":"Snap/hours behavior still coherent."},{"number":12,"name":"Cleanup","do":"Remove test closure/override; leave attraction open.","expect":"Guest map clean for D."}],"group":"console"},{"id":"CON-09","title":"Transportation station + current route","preconditions":"Console open. Zoomobile stations exist on map.","dateUnderTest":"**D** for station closure; route range covering D.","cleanup":"Stations open; restore prior transportation route if known.","steps":[{"number":1,"name":"Close station","do":"**Set transportation station as closed** for D.","expect":"Success."},{"number":2,"name":"Map station closed","do":"Map D with Zoomobile route visible.","expect":"Station closed/missing/messaged."},{"number":3,"name":"Open station","do":"**Set transportation station as open**.","expect":"Success."},{"number":4,"name":"Set Summer route","do":"**Set current transportation route** — choose **Summer**, date range including D.","expect":"Success “Transportation route was set to …”"},{"number":5,"name":"Map summer","do":"Map Explore → Summer/Current as applicable.","expect":"Summer route layer/stations."},{"number":6,"name":"Set Winter route","do":"Set route to **Winter** for a range.","expect":"Success."},{"number":7,"name":"Map winter","do":"Map shows winter route treatment.","expect":"Winter differs from summer where designed."},{"number":8,"name":"Itinerary transport","do":"If itinerary transport options change with route, spot-check.","expect":"Noted or N/A."},{"number":9,"name":"Restore route","do":"Set route back to the previous/current intended season.","expect":"Restored."},{"number":10,"name":"Cleanup stations","do":"Confirm stations open on D.","expect":"Open."}],"group":"console"},{"id":"CON-10","title":"Guardians talks","preconditions":"Console open. Known talk location + talk name from seed.","dateUnderTest":"**D** included in schedule / occurrence.","cleanup":"End schedules; cancel leftover occurrences; map quiet for talk on D if intended.","steps":[{"number":1,"name":"Set schedule","do":"**Set Meet the Guardians talk schedule** with **Location**, **Talk name**, recurring **Talk times**, range including D (**Stops being offered on** as needed).","expect":"Success schedule saved."},{"number":2,"name":"Map talk visible","do":"Map D; enable **Meet The Guardians Talks** filter.","expect":"Talk marker/tooltip present."},{"number":3,"name":"Itinerary lists talk","do":"Itinerary builder on D; Meet the Guardians step.","expect":"Talk offered."},{"number":4,"name":"Add occurrence","do":"**Add Meet the Guardians talk occurrence** for a date/time.","expect":"Success added."},{"number":5,"name":"Cancel occurrence","do":"**Cancel Meet the Guardians talk occurrence**.","expect":"Success cancelled."},{"number":6,"name":"Cancelled absent","do":"Itinerary/map for cancelled slot.","expect":"Cancelled occurrence absent as designed."},{"number":7,"name":"End schedule","do":"**End Meet the Guardians talk schedule**.","expect":"Success ended."},{"number":8,"name":"Future clear","do":"Check a future date that was only covered by ended schedule.","expect":"Talks cleared as designed."},{"number":9,"name":"Duplicate time Notes","do":"Optionally resubmit duplicate time to see error.","expect":"Error string noted (optional)."},{"number":10,"name":"Cleanup","do":"No unintended live schedules left for test talk.","expect":"Clean."},{"number":11,"name":"Final map","do":"Map filter talks on D.","expect":"Quiet/expected state."},{"number":12,"name":"Record names","do":"Notes: talk + location + D.","expect":"Notes."}],"group":"console"},{"id":"CON-11","title":"Wild encounters","preconditions":"Console open. Known wild encounter from seed.","dateUnderTest":"**D** in schedule.","cleanup":"End schedule; cancel test occurrences.","steps":[{"number":1,"name":"Set schedule","do":"**Set Wild Encounter schedule** including D.","expect":"Success saved."},{"number":2,"name":"Map verify","do":"Map D; enable **Wild Encounters** filter.","expect":"Meeting spot / encounter marker visible."},{"number":3,"name":"Itinerary selector","do":"Itinerary Wild Encounters step on D.","expect":"Encounter listed."},{"number":4,"name":"Cancel occurrence","do":"**Cancel Wild Encounter occurrence** (add occurrence first only if required to have something to cancel).","expect":"Success cancelled."},{"number":5,"name":"Cancelled absent","do":"Itinerary/map for that slot.","expect":"Absent as designed."},{"number":6,"name":"End schedule","do":"**End Wild Encounter schedule**.","expect":"Success ended."},{"number":7,"name":"Future clear","do":"Future date check.","expect":"Cleared as designed."},{"number":8,"name":"Duplicate time optional","do":"Optional duplicate-time validation Notes.","expect":"Optional."},{"number":9,"name":"Cleanup","do":"No leftover test schedule.","expect":"Clean."},{"number":10,"name":"Final map","do":"Map quiet/expected.","expect":"OK."}],"group":"console"},{"id":"CON-12","title":"Drinking fountains","preconditions":"Console open.","dateUnderTest":"**D** inside close window.","cleanup":"**Open drinking fountains** so fountains are open again.","steps":[{"number":1,"name":"Close fountains","do":"**Close drinking fountains** for a window covering D; optional message.","expect":"Success closed."},{"number":2,"name":"Map markers/banners","do":"Map D; enable **Drinking Fountains** filter.","expect":"Closed treatment and/or banners."},{"number":3,"name":"Open fountains","do":"**Open drinking fountains**.","expect":"Success open."},{"number":4,"name":"Map restored","do":"Map D.","expect":"Fountains restored/open treatment."},{"number":5,"name":"Filter toggle","do":"Toggle Drinking Fountains filter off/on.","expect":"Markers show/hide."},{"number":6,"name":"Seasonal Notes","do":"Note interaction with seed seasonal fountain curve if visible.","expect":"Notes."},{"number":7,"name":"Cleanup","do":"Fountains open after suite.","expect":"Open."},{"number":8,"name":"Pass","do":"Map matches final open state.","expect":"Pass."}],"group":"console"},{"id":"CON-13","title":"Updates CRUD","preconditions":"Console open.","dateUnderTest":"**D** inside update active range.","cleanup":"End update so it is inactive after test (or note leftover).","steps":[{"number":1,"name":"Create update","do":"**Create update** with **Title**, **Description**, **Type** (e.g. New Arrival), **Start date** covering D, optional **No longer applies on**.","expect":"Success created."},{"number":2,"name":"Map Updates shows it","do":"Map Explore → **Updates** on D.","expect":"Update visible."},{"number":3,"name":"Edit update","do":"**Edit update** description/type/end.","expect":"Success edited."},{"number":4,"name":"Map reflects edit","do":"Refresh Updates on D.","expect":"Edited content shown."},{"number":5,"name":"End update","do":"**End update** effective on/before D as designed.","expect":"Success ended."},{"number":6,"name":"Map inactive","do":"Updates on D.","expect":"No longer listed as active (or ended treatment)."},{"number":7,"name":"Inside vs outside range","do":"Before ending, flip map date inside/outside range once.","expect":"Presence matches range."},{"number":8,"name":"Cleanup","do":"Ensure test update ended.","expect":"Clean enough for other suites."},{"number":9,"name":"No crash","do":"Carousel/collapse still works.","expect":"OK."},{"number":10,"name":"Pass","do":"CRUD + map verify done.","expect":"Pass."}],"group":"console"},{"id":"CON-14","title":"Create event","preconditions":"Console open. Note: ending events may be unavailable — document in Notes.","dateUnderTest":"**D** inside event dates; also test a date outside range.","cleanup":"Note leftover event if it cannot be ended from console.","steps":[{"number":1,"name":"Create event","do":"**Create event** with name, location, description, optional link, dates covering D.","expect":"Success created."},{"number":2,"name":"Map Events shows","do":"Map Explore → **Events** on D.","expect":"Event visible."},{"number":3,"name":"Open link","do":"If link present, open/check it.","expect":"Link works or N/A."},{"number":4,"name":"Outside range","do":"Set map date outside event range.","expect":"Event absent."},{"number":5,"name":"Inside range again","do":"Return map date to D.","expect":"Event present."},{"number":6,"name":"No itinerary required","do":"Skip itinerary.","expect":"Map-only verify OK."},{"number":7,"name":"Endability Notes","do":"Check whether console can end/delete event.","expect":"Notes."},{"number":8,"name":"Pass","do":"Create + map date gating verified.","expect":"Pass."}],"group":"console"},{"id":"CON-15","title":"Console validation matrix","preconditions":"Console open. No guest map/itinerary verify required. Use any convenient entities.","dateUnderTest":"N/A.","cleanup":"Delete/revert the one successful submit at the end.","steps":[{"number":1,"name":"Missing entity","do":"Submit an op that requires an entity with it blank (e.g. closed restaurant without name).","expect":"Validation: entity required style message."},{"number":2,"name":"End before start","do":"Enter end date before start date.","expect":"**End date cannot be before the start date.** (or Invalid start/end)."},{"number":3,"name":"Daily viewing times","do":"Visibility schedule without start/end times.","expect":"**Daily viewing start and end times are required.**"},{"number":4,"name":"Weekly preset locks","do":"Opening schedule: try **weekendsOnly** / holidays checkbox interaction.","expect":"Holidays checkbox locks/behaves per preset."},{"number":5,"name":"Attraction hours inverted","do":"**Set attraction hours** with weekday start after end.","expect":"**Weekday start time must be before weekday end time.**"},{"number":6,"name":"Hours outside zoo hours","do":"Set attraction hours outside zoo bounds.","expect":"Bounds validation or API invalid hours message."},{"number":7,"name":"Duplicate encounter time","do":"Wild encounter schedule with duplicate time rows.","expect":"**Each encounter time can only be added once.**"},{"number":8,"name":"Empty required message","do":"Closed op without required guest message if required.","expect":"Validation blocks submit."},{"number":9,"name":"Overlap Cancel","do":"Trigger **Schedule conflict** and click Cancel.","expect":"No schedule change applied."},{"number":10,"name":"Fix one form valid","do":"Correct one form to valid inputs.","expect":"Ready to submit."},{"number":11,"name":"Success submit","do":"Submit successfully.","expect":"Success status shown."},{"number":12,"name":"Cleanup success row","do":"Revert/end/delete that successful test row.","expect":"Clean."}],"group":"console"}];
(function () {
   var STORAGE_KEY = "tzg.manualTestResults.v1";
   var GROUP_LABELS = {"map":"Map","itinerary":"Itinerary","console":"Console"};
   var GROUPS = ["map","itinerary","console"];
   var suites = window.__SUITES__;
   var activeId = null;

   function byId( id ) {
      for ( var i = 0; i < suites.length; i += 1 ) {
         if ( suites[ i ].id === id ) return suites[ i ];
      }
      return null;
   }

   function loadAll() {
      try {
         var raw = localStorage.getItem( STORAGE_KEY );
         return raw ? JSON.parse( raw ) : {};
      } catch ( e ) {
         return {};
      }
   }

   function saveAll( all ) {
      localStorage.setItem( STORAGE_KEY, JSON.stringify( all ) );
   }

   function getSuiteResults( suiteId ) {
      return loadAll()[ suiteId ] || { steps: {} };
   }

   function setStepResult( suiteId, stepNumber, result ) {
      var all = loadAll();
      var saved = all[ suiteId ] || { steps: {} };
      var step = saved.steps[ stepNumber ] || {};
      if ( result ) step.result = result;
      else delete step.result;
      if ( !step.result && !step.notes ) delete saved.steps[ stepNumber ];
      else saved.steps[ stepNumber ] = step;
      all[ suiteId ] = saved;
      saveAll( all );
   }

   function setStepNotes( suiteId, stepNumber, notes ) {
      var all = loadAll();
      var saved = all[ suiteId ] || { steps: {} };
      var step = saved.steps[ stepNumber ] || {};
      step.notes = notes;
      saved.steps[ stepNumber ] = step;
      all[ suiteId ] = saved;
      saveAll( all );
   }

   function clearSuite( suiteId ) {
      var all = loadAll();
      delete all[ suiteId ];
      saveAll( all );
   }

   function escapeHtml( value ) {
      return String( value == null ? '' : value )
         .replace(/&/g, '&amp;')
         .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;')
         .replace(/"/g, '&quot;');
   }

   function applyNavProgress() {
      var buttons = document.querySelectorAll( '.suite-link' );
      for ( var i = 0; i < buttons.length; i += 1 ) {
         var button = buttons[ i ];
         var suite = byId( button.getAttribute( 'data-suite-id' ) );
         button.classList.remove( 'is-complete', 'is-partial', 'is-failed', 'is-active' );
         if ( suite && suite.id === activeId ) button.classList.add( 'is-active' );
         if ( !suite ) continue;
         var saved = getSuiteResults( suite.id );
         var results = [];
         Object.keys( saved.steps || {} ).forEach( function ( key ) {
            if ( saved.steps[ key ].result ) results.push( saved.steps[ key ].result );
         } );
         if ( results.length === 0 ) continue;
         if ( results.indexOf( 'fail' ) !== -1 ) {
            button.classList.add( 'is-failed' );
         } else if ( results.length >= suite.steps.length ) {
            button.classList.add( 'is-complete' );
         } else {
            button.classList.add( 'is-partial' );
         }
      }
   }

   function updateSummary( suite ) {
      var saved = getSuiteResults( suite.id );
      var pass = 0, fail = 0, blocked = 0;
      Object.keys( saved.steps || {} ).forEach( function ( key ) {
         var result = saved.steps[ key ].result;
         if ( result === 'pass' ) pass += 1;
         else if ( result === 'fail' ) fail += 1;
         else if ( result === 'blocked' ) blocked += 1;
      } );
      var answered = pass + fail + blocked;
      document.getElementById( 'summary' ).textContent =
         answered + '/' + suite.steps.length + ' recorded · ' + pass + ' pass · ' + fail + ' fail · ' + blocked + ' blocked';
   }

   function applyStepUi( article, savedStep ) {
      article.classList.remove( 'result-pass', 'result-fail', 'result-blocked' );
      if ( savedStep.result ) article.classList.add( 'result-' + savedStep.result );
      var buttons = article.querySelectorAll( '.result-btn' );
      for ( var i = 0; i < buttons.length; i += 1 ) {
         var btn = buttons[ i ];
         btn.setAttribute(
            'aria-pressed',
            savedStep.result === btn.getAttribute( 'data-result' ) ? 'true' : 'false'
         );
      }
      article.querySelector( '.notes' ).value = savedStep.notes || '';
   }

   function renderSuite( suiteId ) {
      var suite = byId( suiteId );
      if ( !suite ) return;
      activeId = suiteId;
      var saved = getSuiteResults( suite.id );
      var main = document.getElementById( 'main' );
      var html = '';
      html += '<header class="suite-header">';
      html += '<h1>' + escapeHtml( suite.id + ' — ' + suite.title ) + '</h1>';
      html += '<p><strong>Preconditions:</strong> ' + escapeHtml( suite.preconditions ) + '</p>';
      html += '<p><strong>Date under test:</strong> ' + escapeHtml( suite.dateUnderTest ) + '</p>';
      html += '<p><strong>Cleanup:</strong> ' + escapeHtml( suite.cleanup ) + '</p>';
      html += '<div class="actions">';
      html += '<button type="button" id="clearResults">Clear suite results</button>';
      html += '<button type="button" id="downloadResults">Download results JSON</button>';
      html += '</div></header>';
      html += '<p id="summary" class="summary"></p>';

      for ( var i = 0; i < suite.steps.length; i += 1 ) {
         var step = suite.steps[ i ];
         html += '<article class="step" data-step="' + step.number + '">';
         html += '<h2>Step ' + step.number + ' — ' + escapeHtml( step.name ) + '</h2>';
         html += '<p><strong>Do:</strong> ' + escapeHtml( step.do ) + '</p>';
         html += '<p><strong>Expect:</strong> ' + escapeHtml( step.expect ) + '</p>';
         html += '<div class="result-row"><span class="result-label">Result:</span>';
         html += '<button type="button" class="result-btn result-pass" data-result="pass" aria-label="Pass" title="Pass" aria-pressed="false">✓</button>';
         html += '<button type="button" class="result-btn result-fail" data-result="fail" aria-label="Fail" title="Fail" aria-pressed="false">✗</button>';
         html += '<button type="button" class="result-btn result-blocked" data-result="blocked" aria-label="Blocked" title="Blocked" aria-pressed="false">◌</button>';
         html += '</div>';
         html += '<label class="notes-label">Notes<textarea class="notes" rows="2" placeholder="Optional notes…"></textarea></label>';
         html += '</article>';
      }
      main.innerHTML = html;

      var articles = main.querySelectorAll( '.step' );
      for ( var a = 0; a < articles.length; a += 1 ) {
         (function ( article ) {
            var stepNumber = Number( article.getAttribute( 'data-step' ) );
            applyStepUi( article, saved.steps[ stepNumber ] || {} );
            var buttons = article.querySelectorAll( '.result-btn' );
            for ( var b = 0; b < buttons.length; b += 1 ) {
               buttons[ b ].addEventListener( 'click', function ( event ) {
                  var value = event.currentTarget.getAttribute( 'data-result' );
                  var current = getSuiteResults( suite.id ).steps[ stepNumber ] || {};
                  var next = current.result === value ? null : value;
                  setStepResult( suite.id, stepNumber, next );
                  applyStepUi( article, getSuiteResults( suite.id ).steps[ stepNumber ] || {} );
                  updateSummary( suite );
                  applyNavProgress();
               } );
            }
            article.querySelector( '.notes' ).addEventListener( 'input', function ( event ) {
               setStepNotes( suite.id, stepNumber, event.target.value );
            } );
         })( articles[ a ] );
      }

      document.getElementById( 'clearResults' ).addEventListener( 'click', function () {
         clearSuite( suite.id );
         renderSuite( suite.id );
      } );

      document.getElementById( 'downloadResults' ).addEventListener( 'click', function () {
         var payload = {
            suiteId: suite.id,
            exportedAt: new Date().toISOString(),
            results: getSuiteResults( suite.id )
         };
         var blob = new Blob( [ JSON.stringify( payload, null, 2 ) ], { type: 'application/json' } );
         var url = URL.createObjectURL( blob );
         var anchor = document.createElement( 'a' );
         anchor.href = url;
         anchor.download = suite.id + '-results.json';
         anchor.click();
         URL.revokeObjectURL( url );
      } );

      updateSummary( suite );
      applyNavProgress();
      document.getElementById( 'status' ).textContent =
         suite.id + ': click ✓ / ✗ / ◌ to record results (saved in this browser).';

      try {
         history.replaceState( {}, '', '#' + encodeURIComponent( suite.id ) );
      } catch ( e ) {}
   }

   function renderNav() {
      var nav = document.getElementById( 'nav' );
      var html = '';
      for ( var g = 0; g < GROUPS.length; g += 1 ) {
         var group = GROUPS[ g ];
         html += '<h2>' + escapeHtml( GROUP_LABELS[ group ] ) + '</h2><ul class="suite-list">';
         for ( var i = 0; i < suites.length; i += 1 ) {
            if ( suites[ i ].group !== group ) continue;
            html += '<li><button type="button" class="suite-link" data-suite-id="' +
               escapeHtml( suites[ i ].id ) + '">' +
               escapeHtml( suites[ i ].id + ' — ' + suites[ i ].title ) +
               '</button></li>';
         }
         html += '</ul>';
      }
      nav.innerHTML = html;
      var buttons = nav.querySelectorAll( '.suite-link' );
      for ( var b = 0; b < buttons.length; b += 1 ) {
         buttons[ b ].addEventListener( 'click', function ( event ) {
            renderSuite( event.currentTarget.getAttribute( 'data-suite-id' ) );
         } );
      }
   }

   renderNav();
   var hashId = ( location.hash || '' ).replace( /^#/, '' );
   var start = byId( decodeURIComponent( hashId ) ) || suites[ 0 ];
   if ( start ) renderSuite( start.id );
})();
   </script>
</body>
</html>
