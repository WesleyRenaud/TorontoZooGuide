<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Manual test runner — Toronto Zoo Guide</title>
   <style>
:root {
   --mt-bg: #eef1ea;
   --mt-panel: #f7f8f4;
   --mt-ink: #1c2420;
   --mt-muted: #5c6b63;
   --mt-line: #c5cec4;
   --mt-accent: #3d5c45;
   --mt-pass: #2f6b3a;
   --mt-fail: #9b2f2f;
   --mt-blocked: #6b5a2f;
   --mt-pass-bg: #d9eadc;
   --mt-fail-bg: #f3d6d6;
   --mt-blocked-bg: #efe6c9;
}
* { box-sizing: border-box; }
body {
   margin: 0;
   min-height: 100vh;
   font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
   color: var(--mt-ink);
   background:
      radial-gradient(circle at top left, #dfe8d8 0%, transparent 42%),
      linear-gradient(180deg, #f4f6f1 0%, var(--mt-bg) 100%);
}
.top {
   display: flex;
   justify-content: space-between;
   gap: 1.5rem;
   align-items: end;
   padding: 1.25rem 1.5rem;
   border-bottom: 1px solid var(--mt-line);
   background: rgba(247, 248, 244, 0.92);
}
.kicker {
   margin: 0 0 0.2rem;
   text-transform: uppercase;
   letter-spacing: 0.08em;
   font-size: 0.75rem;
   color: var(--mt-muted);
}
.top h1 {
   margin: 0;
   font-size: 1.6rem;
   font-weight: 650;
}
.status {
   margin: 0;
   max-width: 28rem;
   color: var(--mt-muted);
   font-size: 0.95rem;
}
.layout {
   display: grid;
   grid-template-columns: minmax(14rem, 20rem) 1fr;
   min-height: calc(100vh - 5.5rem);
}
.nav {
   padding: 1rem 1rem 2rem;
   border-right: 1px solid var(--mt-line);
   background: var(--mt-panel);
   overflow: auto;
}
.nav h2 {
   margin: 1rem 0 0.4rem;
   font-size: 0.8rem;
   text-transform: uppercase;
   letter-spacing: 0.06em;
   color: var(--mt-muted);
}
.suite-list {
   list-style: none;
   margin: 0;
   padding: 0;
}
.suite-link {
   width: 100%;
   text-align: left;
   border: 1px solid transparent;
   background: transparent;
   color: inherit;
   border-radius: 0.45rem;
   padding: 0.45rem 0.55rem;
   margin-bottom: 0.2rem;
   cursor: pointer;
   font: inherit;
}
.suite-link:hover { background: #e7ece3; }
.suite-link.is-active {
   border-color: var(--mt-accent);
   background: #e2ebdf;
}
.suite-link.is-partial { box-shadow: inset 3px 0 0 var(--mt-blocked); }
.suite-link.is-failed { box-shadow: inset 3px 0 0 var(--mt-fail); }
.suite-link.is-complete { box-shadow: inset 3px 0 0 var(--mt-pass); }
.main {
   padding: 1.25rem 1.5rem 3rem;
   overflow: auto;
}
.suite-header h1 {
   margin: 0 0 0.75rem;
   font-size: 1.45rem;
}
.suite-header p {
   margin: 0.35rem 0;
   line-height: 1.45;
}
.actions {
   display: flex;
   flex-wrap: wrap;
   gap: 0.5rem;
   margin: 1rem 0 0.5rem;
}
.actions button,
.result-btn {
   font: inherit;
   cursor: pointer;
}
.actions button {
   border: 1px solid var(--mt-line);
   background: #fff;
   border-radius: 0.4rem;
   padding: 0.4rem 0.7rem;
}
.summary {
   margin: 0 0 1rem;
   color: var(--mt-muted);
}
.step {
   background: #fff;
   border: 1px solid var(--mt-line);
   border-radius: 0.65rem;
   padding: 0.9rem 1rem 1rem;
   margin-bottom: 0.75rem;
}
.step h2 {
   margin: 0 0 0.55rem;
   font-size: 1.05rem;
}
.step p {
   margin: 0.35rem 0;
   line-height: 1.45;
}
.step.result-pass {
   background: var(--mt-pass-bg);
   border-color: #b7d4bc;
}
.step.result-fail {
   background: var(--mt-fail-bg);
   border-color: #e0b4b4;
}
.step.result-blocked {
   background: var(--mt-blocked-bg);
   border-color: #ddd0a6;
}
.result-row {
   display: flex;
   align-items: center;
   gap: 0.45rem;
   margin: 0.75rem 0 0.5rem;
}
.result-label {
   font-weight: 650;
   margin-right: 0.25rem;
}
.result-btn {
   width: 2.35rem;
   height: 2.35rem;
   border-radius: 999px;
   border: 1.5px solid var(--mt-line);
   background: #fff;
   font-size: 1.15rem;
   line-height: 1;
}
.result-btn.result-pass[aria-pressed="true"] {
   background: var(--mt-pass);
   border-color: var(--mt-pass);
   color: #fff;
}
.result-btn.result-fail[aria-pressed="true"] {
   background: var(--mt-fail);
   border-color: var(--mt-fail);
   color: #fff;
}
.result-btn.result-blocked[aria-pressed="true"] {
   background: var(--mt-blocked);
   border-color: var(--mt-blocked);
   color: #fff;
}
.notes-label {
   display: grid;
   gap: 0.3rem;
   font-weight: 650;
   margin-top: 0.35rem;
}
.notes {
   width: 100%;
   font: inherit;
   border: 1px solid var(--mt-line);
   border-radius: 0.4rem;
   padding: 0.45rem 0.55rem;
   resize: vertical;
   background: rgba(255, 255, 255, 0.85);
}
@media (max-width: 840px) {
   .layout { grid-template-columns: 1fr; }
   .nav {
      border-right: 0;
      border-bottom: 1px solid var(--mt-line);
      max-height: 14rem;
   }
   .top {
      flex-direction: column;
      align-items: start;
   }
}
   </style>
</head>
<body>
   <header class="top">
      <div>
         <p class="kicker">Toronto Zoo Guide</p>
         <h1>Manual test runner</h1>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
   </header>
   <div class="layout">
      <nav id="nav" class="nav" aria-label="Test suites"></nav>
      <main id="main" class="main"></main>
   </div>
   <script>
window.__SUITES__ = [{"id":"MAP-01","title":"Baseline load and chrome","steps":[{"number":1,"name":"Open map page","do":"With the app open, use the bottom nav to open **Map**.","expect":"Page loads; zoo map SVG appears in the map mount; no hard failure / blank page."},{"number":2,"name":"Explore panel visible","do":"Look at the left **Explore** panel.","expect":"Panel titled **Explore** is visible with toggles, Filter, and search."},{"number":3,"name":"Bottom nav links","do":"Look at the bottom nav.","expect":"Links include **Map**, **Animals**, Meet the Guardians (external), Wild Encounters (external), and **Itinerary**."},{"number":4,"name":"Pan map","do":"Click-drag the map canvas.","expect":"Map pans; markers move with the map."},{"number":5,"name":"Zoom map","do":"Zoom in and out (scroll/pinch/controls as available).","expect":"Map zooms; markers remain attached to locations."},{"number":6,"name":"Show region/pavilion text default on","do":"Confirm **Show region/pavilion text** is checked (it defaults on) and look at the map.","expect":"Checkbox is checked; region/pavilion labels are visible on the map."},{"number":7,"name":"Show region/pavilion text off","do":"Uncheck **Show region/pavilion text**.","expect":"Those labels hide."},{"number":8,"name":"Default animal markers","do":"With default filters (Animals checked), observe the map.","expect":"Animal markers are visible on the map."}],"group":"map"},{"id":"MAP-02","title":"Date presets","steps":[{"number":1,"name":"Select Summer Map","do":"In the map controls dropdown, choose **Summer Map**.","expect":"Preset switches to **Summer Map**."},{"number":2,"name":"Summer date control","do":"Observe the date field near the map preset control.","expect":"Date field is hidden or not used for free picking (summer uses fixed seasonal anchor)."},{"number":3,"name":"Summer seed markers","do":"With **Animals** checked, search **River Hippopotamus** and confirm its marker. Enable **Attractions** and find **Splash Island**. Select Zoomobile **Current Route** and note stations (seed summer route includes **Canadian Domain Zoomobile Station** and **Africa Zoomobile Station**).","expect":"**River Hippopotamus** marker is present; **Splash Island** marker is present; Zoomobile **Current Route** shows the summer stations above (Main / Tundra / Eurasia may also appear)."},{"number":4,"name":"Select Winter Map","do":"Choose **Winter Map**.","expect":"Preset switches to **Winter Map**."},{"number":5,"name":"Winter date control","do":"Observe the date field near the map preset control.","expect":"Date field is hidden or not used for free picking (winter uses fixed seasonal anchor)."},{"number":6,"name":"Winter seed markers vs summer","do":"Still on **Winter Map**, search **River Hippopotamus** again; with **Attractions** on, look for **Splash Island**; keep Zoomobile **Current Route** and compare stations to summer.","expect":"**River Hippopotamus** marker is absent; **Splash Island** marker is absent; Zoomobile **Current Route** shows **Indo-Malaya Zoomobile Station** and does **not** show **Canadian Domain Zoomobile Station** or **Africa Zoomobile Station** (Main / Tundra / Eurasia may still appear)."},{"number":7,"name":"Select Specific Map","do":"Choose **Specific Map**.","expect":"Preset switches; date field becomes available."},{"number":8,"name":"Open date picker","do":"Click the date field.","expect":"Date picker opens."},{"number":9,"name":"Pick mid-season date","do":"Choose a mid-season date (e.g. a day in May or September).","expect":"Date applies; map refetches."},{"number":10,"name":"Markers refresh for date","do":"Watch animal/attraction markers after the date change (ignore Updates/Events).","expect":"Markers refresh for the selected Specific Map date without a full page reload; Updates/Events stay based on today."}],"group":"map"},{"id":"MAP-03","title":"Type filters and search","steps":[{"number":1,"name":"Animals checked by default","do":"Open **Filter:** dropdown.","expect":"**Animals** checkbox is checked; other types are unchecked by default."},{"number":2,"name":"Uncheck Animals","do":"Uncheck **Animals**.","expect":"Animal markers disappear from the map."},{"number":3,"name":"Recheck Animals","do":"Check **Animals** again.","expect":"Animal markers return."},{"number":4,"name":"Enable Restaurants","do":"Check **Restaurants**.","expect":"Restaurant markers appear (in addition to animals)."},{"number":5,"name":"Disable Restaurants","do":"Uncheck **Restaurants**.","expect":"Restaurant markers hide; animals remain."},{"number":6,"name":"Spot-check another type","do":"Briefly enable **Pavilions** or **Attractions**, then disable.","expect":"Corresponding markers show/hide without breaking Animals."},{"number":7,"name":"Search query","do":"In **Search animals** / Search… field, type part of the known species name.","expect":"Results list under the search field populates."},{"number":8,"name":"Select search result","do":"Click **View on Map** on a search result.","expect":"Map pans/focuses to that animal’s marker."},{"number":9,"name":"Tooltip opens on focus","do":"Look at the focused animal marker after **View on Map**.","expect":"That animal’s tooltip opens on the focused marker."},{"number":10,"name":"Clear via uncheck Animals","do":"Uncheck **Animals** while search results are visible.","expect":"Search results clear or animal results are removed as designed."},{"number":11,"name":"Restore search","do":"Recheck **Animals** and search again.","expect":"Search works again and can focus a marker."}],"group":"map"},{"id":"MAP-04","title":"Markers, likelihood, stacks","steps":[{"number":1,"name":"Pick mixed-likelihood date","do":"Set Specific Map to early/mid March (before late April, when **Grevy's Zebra** is already near peak).","expect":"Date applies; markers reload."},{"number":2,"name":"Likelihood colour","do":"Find **Grevy's Zebra**, note its icon colour (low likelihood leans dark red; high leans dark green), then switch to a peak-summer Specific Map date and compare the same marker.","expect":"On early/mid March the icon is toward dark red / orange; on peak summer it is toward dark green."},{"number":3,"name":"Find Kids Zoo stack","do":"Still on peak summer, search **Rabbit** or **African Spurred Tortoise** and **View on Map**.","expect":"A count marker appears for the shared **Kids Zoo** location (more than one animal)."},{"number":4,"name":"Click stack","do":"Click that **Kids Zoo** count marker.","expect":"Tooltip opens with a multi-item carousel."},{"number":5,"name":"Carousel lists several animals","do":"Look through the carousel entries.","expect":"Several **Kids Zoo** animals appear (e.g. **Rabbit**, **African Spurred Tortoise**, **Common Raven**)."},{"number":6,"name":"Advance carousel","do":"Use next/prev on the carousel.","expect":"Each step shows a different animal name."},{"number":7,"name":"Amenity styling spot-check","do":"Enable **Restaurants** or **Gift Shops** or **Attractions**; spot-check open/closed or likelihood styling.","expect":"Markers render with expected open/closed or likelihood treatment."},{"number":8,"name":"Zoom stability","do":"Zoom in/out around markers.","expect":"Markers stay anchored; not orphaned off-map incorrectly."},{"number":9,"name":"Return to Specific Map","do":"Leave a mid-season Specific Map date selected.","expect":"Map remains usable."}],"group":"map"},{"id":"MAP-05","title":"Tooltips and species overlay","steps":[{"number":1,"name":"Hover tooltip","do":"Hover an animal marker (e.g. **African Lion**).","expect":"Hover tooltip appears with the species name (e.g. **African Lion**)."},{"number":2,"name":"Click tooltip","do":"Click the animal marker.","expect":"Click tooltip opens."},{"number":3,"name":"Tooltip essentials","do":"Read the click tooltip for **African Lion**.","expect":"Shows a detail image, the species name (**African Lion**), exhibit (**Africa Savanna**), and a **Likelihood:** line with a phrase and percent (e.g. `Likelihood: Very High (~100%)`)."},{"number":4,"name":"More Info","do":"Click the species name (**African Lion**) in the tooltip.","expect":"Species overlay opens."},{"number":5,"name":"Overlay content","do":"Inspect overlay content.","expect":"Detail content loads (not blank/error-only)."},{"number":6,"name":"Close overlay","do":"Click the overlay close control.","expect":"Overlay hides."},{"number":7,"name":"Amenity or pavilion tooltip","do":"Enable **Restaurants** or **Pavilions**; click a non-animal marker.","expect":"Type-appropriate tooltip appears."},{"number":8,"name":"Dismiss tooltip","do":"Click empty map or dismiss control.","expect":"Tooltip closes."},{"number":9,"name":"Replace tooltip","do":"Quickly click another marker.","expect":"Tooltip content switches cleanly to the new target."},{"number":10,"name":"Hover after click","do":"Hover a different marker after dismissing click tooltip.","expect":"Hover tooltip still works."}],"group":"map"},{"id":"MAP-06","title":"Off-display and closed include toggles","steps":[{"number":1,"name":"Baseline","do":"Confirm every **Include …** Explore toggle is unchecked (**Include off display animals**, **Include closed restaurants**, **Include closed restrooms**, **Include closed gift shops**, **Include closed attractions**). Note which markers are on the map.","expect":"Those toggles are all off, and you have a clear before-picture of visible markers for later comparison."},{"number":2,"name":"Midwinter without off-display animals","do":"Set Specific Map to a midwinter weekday. Keep **Animals** checked in **Filter:**. Search **Warthog** (or **River Hippopotamus**).","expect":"That animal is not on the map while **Include off display animals** is off."},{"number":3,"name":"Include off display animals on","do":"Enable **Include off display animals**, then search **Warthog** (or **River Hippopotamus**) again and **View on Map**.","expect":"The animal marker appears (off-display)."},{"number":4,"name":"Off-display feedback","do":"Open that animal’s click tooltip (and any banner on the marker).","expect":"Off-display messaging is visible."},{"number":5,"name":"Include off display off","do":"Disable **Include off display animals**.","expect":"That off-display animal hides again."},{"number":6,"name":"Include closed restaurants","do":"Still on midwinter, check **Restaurants** in **Filter:**. Confirm **Tundra Tacos** (or **Eurasia Pizza Pizza**) is missing, then enable **Include closed restaurants** and find it.","expect":"The closed restaurant marker appears only after **Include closed restaurants** is on (and **Restaurants** is checked)."},{"number":7,"name":"Restaurants off","do":"Disable **Include closed restaurants**.","expect":"That closed restaurant hides again."},{"number":8,"name":"Include closed gift shops","do":"Check **Gift Shops** in **Filter:**. Confirm **Twiga Market** (or **Courtyard Kiosk**) is missing on midwinter, enable **Include closed gift shops**, then disable it.","expect":"The closed gift shop appears with the include toggle on, and hides when it is off."},{"number":9,"name":"Include closed attractions","do":"Set Specific Map to early October. Check **Attractions** in **Filter:**. Confirm **Splash Island** is missing, enable **Include closed attractions**, find it, then disable the toggle.","expect":"Closed **Splash Island** appears with the include toggle on, and hides when it is off."},{"number":10,"name":"Banner readability","do":"With an include toggle that shows banners or closed/off-display cues, read that text.","expect":"Wording is readable; layout is not fully broken."},{"number":11,"name":"Reset toggles","do":"Uncheck every **Include …** Explore toggle.","expect":"Map matches default inclusion (closed/off-display extras gone)."}],"group":"map"},{"id":"MAP-07","title":"Zoomobile routes","steps":[{"number":1,"name":"None","do":"Select **None** under Zoomobile/transportation routes.","expect":"No Zoomobile route SVG/arrows shown."},{"number":2,"name":"Current Route","do":"Select **Current Route**.","expect":"Route and/or stations appear per current season rules."},{"number":3,"name":"Summer Route","do":"Select **Summer Route**.","expect":"Summer Zoomobile stations appear, including **Canadian Domain Zoomobile Station** and **Africa Zoomobile Station** (also **Main**, **Tundra**, and **Eurasia**)."},{"number":4,"name":"Winter Route","do":"Select **Winter Route**.","expect":"Winter Zoomobile stations appear, including **Indo-Malaya Zoomobile Station**; **Canadian Domain Zoomobile Station** and **Africa Zoomobile Station** do not (Main / Tundra / Eurasia may still appear)."},{"number":5,"name":"Station tooltip","do":"Click **Main Zoomobile Station** (or another visible Zoomobile station marker).","expect":"Tooltip shows that station’s name and description."},{"number":6,"name":"Back to None","do":"Select **None** again.","expect":"Route layers clear."},{"number":7,"name":"Animals still present","do":"Confirm **Animals** still checked.","expect":"Animal markers still present."},{"number":8,"name":"No leftover arrows","do":"Pan around former route areas.","expect":"No orphaned route arrows/markers left behind."},{"number":9,"name":"Repeat Current once","do":"Toggle Current → None once more.","expect":"Still cleans up reliably."}],"group":"map"},{"id":"MAP-08","title":"Updates and Events","steps":[{"number":1,"name":"Updates and events section","do":"Look in Explore for the **Updates and events** heading and tabs.","expect":"Either the whole section is hidden (no updates or events for today), or it is visible with **Updates** and/or **Events** tabs."},{"number":2,"name":"Updates card","do":"If **Updates** is available, select it and read the visible card.","expect":"The active card shows a type label and a non-blank title. If **Updates** is unavailable or the section is hidden, that is the expected empty outcome for today."},{"number":3,"name":"Collapse/expand","do":"If the section is visible, click the triangle/chevron button beside the **Updates** / **Events** tabs (points down when open, up when collapsed).","expect":"The updates/events cards hide when collapsed and return when expanded. If the section was hidden in step 1, that button is not available."},{"number":4,"name":"Updates carousel","do":"If more than one update is loaded, use previous/next update controls.","expect":"The visible update card changes. If zero or one update, there is nothing to advance."},{"number":5,"name":"Events tab","do":"If **Events** is available, select it.","expect":"The **Events** tab becomes active. If **Events** is unavailable or the section is hidden, that is the expected empty outcome for today."},{"number":6,"name":"Events card","do":"If an event card is shown, read it.","expect":"The active card shows an event name (title) and may include a date range and description. If no event card is shown, that matches the empty outcome above."},{"number":7,"name":"Change map date","do":"On Specific Map, change the date.","expect":"Date applies; map markers/context update."},{"number":8,"name":"Updates/Events stay on today","do":"Recheck Updates and Events after the map date change.","expect":"Updates and Events content is unchanged by the map date (still based on today’s real date)."}],"group":"map"},{"id":"MAP-09","title":"View on Map from Animals","steps":[{"number":1,"name":"Open Animals","do":"From the bottom nav, open **Animals**.","expect":"Animals page loads."},{"number":2,"name":"Open a species","do":"Open **African Lion** (or another known seed animal).","expect":"Species detail shows, including **View on Map**."},{"number":3,"name":"View on Map","do":"Click **View on Map**.","expect":"You land on the map page."},{"number":4,"name":"Map focuses the animal","do":"Watch the map after it loads.","expect":"The map pans/zooms to **African Lion**; its tooltip opens."},{"number":5,"name":"Animals filter on","do":"Open **Filter:**.","expect":"**Animals** is checked."},{"number":6,"name":"Stay usable after focus","do":"Dismiss the tooltip if needed, then pan/zoom the map.","expect":"Map remains usable."},{"number":7,"name":"Bottom nav still works","do":"Use bottom nav to go to **Itinerary**, then back to **Map**.","expect":"Navigation works; map loads normally without forcing another focus."}],"group":"map"},{"id":"ITIN-01","title":"Wizard happy path","steps":[{"number":1,"name":"Open itinerary","do":"From the bottom nav, open **Itinerary**. Use **Edit Itinerary** / **Build Itinerary** to open the builder if needed.","expect":"Itinerary page loads; builder can be opened."},{"number":2,"name":"Set Visit Date","do":"Complete **Set Visit Date** and continue.","expect":"Date is accepted; next wizard step appears."},{"number":3,"name":"Add Animals by Region","do":"On **Add Animals by Region**, select at least one region/exhibit and continue.","expect":"Selection is kept; proceed to animals."},{"number":4,"name":"Add Animals","do":"On **Add Animals**, add ≥1 animal.","expect":"Animal appears selected in the builder."},{"number":5,"name":"Add Attractions","do":"On **Add Attractions**, add 0 or 1 attraction and continue.","expect":"Step completes (empty OK)."},{"number":6,"name":"Meet the Guardians","do":"On the Meet the Guardians step, add a talk if listed, else continue.","expect":"Pass with Notes “none offered” if empty for the date."},{"number":7,"name":"Wild Encounters","do":"On **Wild Encounters**, add one if listed, else continue.","expect":"Pass with Notes “none offered” if empty."},{"number":8,"name":"Add Transportation","do":"On **Add Transportation**, add or skip, then continue toward finish.","expect":"Step completes."},{"number":9,"name":"Finish with items","do":"Click **Finish** with ≥1 total selected item.","expect":"Finish succeeds; itinerary is saved."},{"number":10,"name":"List view","do":"Click **List View** and confirm sections.","expect":"Sections show selected animals (and other types if chosen); **List View** control is available."},{"number":11,"name":"Day Planner view","do":"Switch to **Day Planner View** if not already shown.","expect":"Day Planner / timeline UI is available (**Arrival time**, **Departure time**, scheduled/unscheduled sections)."},{"number":12,"name":"Map pane markers","do":"Look at the itinerary map pane.","expect":"Planned item markers appear on the map."}],"group":"itinerary"},{"id":"ITIN-02","title":"Date-only finish and clear","steps":[{"number":1,"name":"Open builder","do":"From the bottom nav, open **Itinerary**. Use **Edit Itinerary** / **Build Itinerary** to open the builder if needed.","expect":"Wizard opens (e.g. **Set Visit Date**)."},{"number":2,"name":"Finish with date only","do":"On **Set Visit Date**, pick a date and click **Finish** without adding animals, attractions, talks, encounters, or transport.","expect":"Itinerary saves with that visit date and no selected items."},{"number":3,"name":"Clear itinerary","do":"Click **Clear**.","expect":"**Clear Itinerary?** confirmation appears with the remove-all message."},{"number":4,"name":"Confirm clear","do":"Confirm the clear.","expect":"Itinerary returns to empty state."},{"number":5,"name":"Wizard usable again","do":"Open **Edit Itinerary** / **Build Itinerary** again.","expect":"Wizard starts cleanly (e.g. **Set Visit Date**)."}],"group":"itinerary"},{"id":"ITIN-03","title":"Arrival, departure, early admission","steps":[{"number":1,"name":"Clear confirmation skips","do":"From the project root, run `npm run clear:itinerary-config`, then reload **Itinerary**.","expect":"Command reports no **Don't show this again** skips (or clears any that were on). Short Visit / Early Admission confirmations are no longer skipped."},{"number":2,"name":"Valid times","do":"Set a sensible arrival before departure.","expect":"Times accepted; no blocking validation."},{"number":3,"name":"Invalid order","do":"Set departure before arrival.","expect":"Validation bubble/error on arrival/departure."},{"number":4,"name":"Short visit","do":"With both arrival and departure set, change them to a visit shorter than **2 hours** (e.g. arrival **10:00 AM**, departure **11:00 AM**).","expect":"**Short Visit?** confirmation appears."},{"number":5,"name":"Longer visit","do":"Change arrival and departure so the visit is at least **2 hours** (e.g. arrival **10:00 AM**, departure **2:00 PM**).","expect":"Times are kept. **Short Visit?** does not appear."},{"number":6,"name":"Early admission date","do":"Via **Edit Itinerary** / **Set Visit Date**, pick a **today-or-future** visit date whose Day Planner shows **Early Admission** before **Zoo Opens** (seed weekends/holidays: Early Admission **9:00 AM**, Zoo Opens **9:30 AM**, through Labor Day). If no such date is selectable, mark **Blocked**.","expect":"**Early Admission** appears on the timeline before **Zoo Opens** — or suite **Blocked** if early-admission season has ended."},{"number":7,"name":"Arrival during early admission","do":"If not Blocked: set **Arrival time** to **9:00 AM** (before Zoo Opens). Keep departure at least **2 hours** later so **Short Visit?** does not appear.","expect":"**Early Admission Hours** confirmation appears (members/sensory message, with **Don't show this again**)."},{"number":8,"name":"Cancel early admission","do":"If not Blocked: click **Cancel** on that confirmation.","expect":"Arrival is not saved; the field returns to the previous time (or empty)."},{"number":9,"name":"Confirm early admission","do":"If not Blocked: set **Arrival time** to **9:00 AM** again and click **Confirm**.","expect":"Arrival **9:00 AM** is kept."},{"number":10,"name":"Arrival after open","do":"If not Blocked: set **Arrival time** to **10:00 AM** (at or after **Zoo Opens**).","expect":"Arrival is kept. **Early Admission Hours** does not appear."},{"number":11,"name":"Schedule still coherent","do":"View Day Planner pills if any.","expect":"No crash; timeline still coherent."}],"group":"itinerary"},{"id":"ITIN-04","title":"Schedule module","steps":[{"number":1,"name":"Build with an animal","do":"From the bottom nav, open **Itinerary**. Use **Build Itinerary** / **Edit Itinerary**, set a visit date, add at least one animal (e.g. **African Lion**), then **Finish**.","expect":"Itinerary saves with that animal on the list."},{"number":2,"name":"Open schedule UI","do":"In Day Planner, click **Schedule an item**.","expect":"Schedule module is visible (type, search, time)."},{"number":3,"name":"Choose type","do":"Select **Animal** (or the type that matches the item you added).","expect":"Type filter applies to searchable items."},{"number":4,"name":"Search item","do":"Search for the animal already on the itinerary (e.g. **African Lion**).","expect":"Matching results appear."},{"number":5,"name":"Only on my itinerary","do":"Enable **Only show items on my itinerary**.","expect":"Results restricted to itinerary items."},{"number":6,"name":"Pick time","do":"Choose a valid time within arrival/departure if set.","expect":"Time accepted."},{"number":7,"name":"Optional duration","do":"Set duration if the field is shown.","expect":"Duration accepted or defaults applied."},{"number":8,"name":"Schedule succeeds","do":"Submit/schedule the item.","expect":"A scheduled pill appears on the Day Planner timeline."},{"number":9,"name":"Unschedule via pill menu","do":"Open the pill menu and unschedule.","expect":"Pill removed; item remains on list unscheduled."},{"number":10,"name":"Reschedule","do":"Schedule the same item again at a different time.","expect":"New pill appears at the new time."},{"number":11,"name":"Remove from itinerary","do":"Open that animal’s timeline pill menu (or its row under **Scheduled Items** / **Unscheduled Items**), choose **Remove**, then confirm **Remove from Itinerary?**.","expect":"Animal is gone from the itinerary in both **List View** and **Day Planner View**."},{"number":12,"name":"List vs planner sync","do":"Compare **List View** and **Day Planner View**.","expect":"Both views agree the animal is gone (and any other schedule state matches)."}],"group":"itinerary"},{"id":"ITIN-05","title":"Rebuild and unschedule all","steps":[{"number":1,"name":"Two scheduled stops","do":"From the bottom nav, open **Itinerary**. Build with a visit date and at least **two** animals, **Finish**, then schedule both on Day Planner.","expect":"Day Planner shows at least two scheduled pills, and the itinerary map shows a walk path between them."},{"number":2,"name":"Rebuild schedule","do":"Click **Rebuild schedule**.","expect":"Pills/path regenerate (may reshuffle times)."},{"number":3,"name":"Path after rebuild","do":"Look at the itinerary map.","expect":"Walk path is still shown between the scheduled stops."},{"number":4,"name":"Unschedule all","do":"Click **Unschedule all items**.","expect":"All schedule pills clear, and feedback like **All items unscheduled** appears."},{"number":5,"name":"Path cleared","do":"Look at the itinerary map.","expect":"Walk path is gone."},{"number":6,"name":"List retained","do":"Switch to **List View**.","expect":"The animals are still on the itinerary, unscheduled."},{"number":7,"name":"Schedule one again","do":"Schedule a single animal on Day Planner.","expect":"That animal’s pill appears. The itinerary map shows a walk path from the entrance to that stop."}],"group":"itinerary"},{"id":"ITIN-06","title":"Off-display / low-likelihood confirm","steps":[{"number":1,"name":"Open builder","do":"From the bottom nav, open **Itinerary**. Use **Build Itinerary** / **Edit Itinerary**.","expect":"Builder opens (e.g. **Set Visit Date**)."},{"number":2,"name":"Midwinter visit date","do":"On **Set Visit Date**, pick a midwinter date (e.g. a day in January), then continue to **Add Animals**.","expect":"**Add Animals** is visible."},{"number":3,"name":"Include off-display","do":"Enable **Include off-display animals**.","expect":"Toggle is on."},{"number":4,"name":"Select off-display animal","do":"Select **Warthog** (or **River Hippopotamus**).","expect":"**Animal May Be Off Display** confirmation appears."},{"number":5,"name":"Cancel confirm","do":"Cancel/dismiss without adding.","expect":"Animal is not added to the selection."},{"number":6,"name":"Select again","do":"Select the same animal again.","expect":"**Animal May Be Off Display** appears again."},{"number":7,"name":"Confirm add","do":"Confirm add.","expect":"Animal is added to the selection."},{"number":8,"name":"Finish","do":"Finish the itinerary with that animal included.","expect":"Itinerary saves successfully."}],"group":"itinerary"},{"id":"ITIN-07","title":"Talk and encounter auto-scheduling","steps":[{"number":1,"name":"Open builder","do":"From the bottom nav, open **Itinerary**. Use **Build Itinerary** / **Edit Itinerary**.","expect":"Builder opens (e.g. **Set Visit Date**)."},{"number":2,"name":"Visit date with offerings","do":"On **Set Visit Date**, pick a today-or-future date that offers Meet the Guardians talks and Wild Encounters, then continue through the wizard.","expect":"Meet the Guardians and Wild Encounters steps list at least one option each."},{"number":3,"name":"Add talk","do":"On the Meet the Guardians step, add a listed talk (e.g. **African Penguin** if offered).","expect":"Talk is selected."},{"number":4,"name":"Add wild encounter","do":"On **Wild Encounters**, add a listed encounter (e.g. **Kangaroo** if offered).","expect":"Encounter is selected."},{"number":5,"name":"Finish","do":"Finish the itinerary (extra animals optional).","expect":"Itinerary saves."},{"number":6,"name":"Talk already on planner","do":"Open **Day Planner View**.","expect":"The talk already has a timeline pill at its offered time (fixed-time items are auto-scheduled; do not use **Schedule an item** for them)."},{"number":7,"name":"Encounter already on planner","do":"Find the wild encounter on Day Planner.","expect":"The encounter already has a timeline pill at its offered time."},{"number":8,"name":"List matches planner","do":"Switch to **List View**, then back to **Day Planner View**.","expect":"Talk and encounter appear on the list and stay scheduled on the planner."}],"group":"itinerary"},{"id":"ITIN-08","title":"Conflict and overlap flows","steps":[{"number":1,"name":"Build with two animals","do":"From the bottom nav, open **Itinerary**. Build with a visit date, add **African Lion** and **Grevy's Zebra**, then **Finish**.","expect":"Both animals are on the itinerary."},{"number":2,"name":"Schedule African Lion","do":"In Day Planner, use **Schedule an item** to schedule **African Lion** at **11:00 AM** (keep a normal duration).","expect":"**African Lion** pill appears on the timeline at **11:00 AM**."},{"number":3,"name":"Schedule overlapping Zebra","do":"Open **Schedule an item** again, select **Grevy's Zebra**, set the same overlapping start (**11:00 AM**), then click **Schedule**.","expect":"**Unable to Schedule** appears with **That time is not available. Select another start time and try again.** and **OK**. Zebra is not scheduled."},{"number":4,"name":"Dismiss and keep Lion","do":"Click **OK**, then cancel out of **Schedule item** if it is still open.","expect":"**African Lion** remains scheduled; **Grevy's Zebra** stays unscheduled."},{"number":5,"name":"Find a weekend with time conflicts","do":"Use **Edit Itinerary** / **Build Itinerary**. On **Set Visit Date**, try upcoming Saturdays/Sundays until Meet the Guardians and/or Wild Encounters list at least two offerings that share the same start time (talk+talk, talk+encounter, or encounter+encounter). Note the date and the two names.","expect":"A weekend visit date is set and two same-time offerings are identified."},{"number":6,"name":"Finish with both conflicting offerings","do":"Add both same-time offerings (extra animals optional), then **Finish**.","expect":"**Your Itinerary Has the Following Issues:** appears, including **Schedule Conflicts** listing both activities."},{"number":7,"name":"Proceed with no selection","do":"Leave both unselected and click **Proceed**.","expect":"**Proceed Without Selecting an Activity?** appears (confirm uses **Proceed Anyway**)."},{"number":8,"name":"Cancel proceed-without-selection","do":"Dismiss that confirmation without confirming (Cancel / close).","expect":"Still on **Your Itinerary Has the Following Issues:** / **Schedule Conflicts**."},{"number":9,"name":"Select one activity","do":"Select only one of the two conflicting activities, then click **Proceed**.","expect":"Issues dialog closes and the itinerary saves with that resolution."},{"number":10,"name":"Only selected activity scheduled","do":"Open **Day Planner View**.","expect":"Timeline shows a pill for the activity you selected; the other conflicting offering is not scheduled."},{"number":11,"name":"Stable after conflicts","do":"Reload the itinerary panel / refresh the page and reopen **Itinerary**.","expect":"Scheduled state matches the last successful conflict resolution."}],"group":"itinerary"},{"id":"ITIN-09","title":"Attraction hours and transport prompts","steps":[{"number":1,"name":"Set a known hours window","do":"In Console, open **Set attraction hours**. For **Kangaroo Walk-Thru** (or **Conservation Carousel**), set weekday and weekend/holiday hours to **11:00 AM–3:00 PM** for a today-or-future visit date, then save.","expect":"Success that the attraction hours were saved."},{"number":2,"name":"Build with that attraction","do":"On **Itinerary**, build with that same visit date, add the attraction from step 1, then **Finish**. Keep arrival/departure spanning the attraction hours (or clear them).","expect":"Attraction is on the itinerary."},{"number":3,"name":"Schedule outside hours","do":"In Day Planner, use **Schedule an item** and schedule it at **10:00 AM** (after **Zoo Opens**, before the **11:00 AM** attraction open).","expect":"**Outside Attraction Hours** appears with **Adjust** and **Cancel**."},{"number":4,"name":"Confirm snap","do":"Click **Adjust**.","expect":"Attraction schedules at the nearest valid time inside **11:00 AM–3:00 PM** (not **10:00 AM**)."},{"number":5,"name":"Edit for Zoomobile","do":"Use **Edit Itinerary**. On **Add Attractions**, select **Zoomobile**.","expect":"**Add as Attraction?** appears (scenic trip vs transportation messaging)."},{"number":6,"name":"Choose as attraction","do":"Confirm **Add as Attraction?**.","expect":"**Zoomobile** is selected on **Add Attractions**."},{"number":7,"name":"Add as transportation","do":"Continue to **Add Transportation** and select **Zoomobile**.","expect":"**Add as Transportation?** appears."},{"number":8,"name":"Confirm transportation","do":"Confirm **Add as Transportation?**, then **Finish**.","expect":"Itinerary saves."},{"number":9,"name":"List representations","do":"Open **List View**.","expect":"**Zoomobile** appears as both an attraction and a transportation entry, and they are distinct."}],"group":"itinerary"},{"id":"ITIN-10","title":"Bulk schedule pressure","steps":[{"number":1,"name":"Large animal set","do":"On **Add Animals by Region**, select multiple regions; keep many animals.","expect":"Large selection created."},{"number":2,"name":"Short visit window","do":"After finish (or in planner), set arrival/departure to a short window (e.g. 2 hours).","expect":"Short window set."},{"number":3,"name":"Build/finish","do":"Finish/build so bulk schedule runs.","expect":"Bulk scheduling runs."},{"number":4,"name":"Visit window expands to fit","do":"Inspect **Arrival time**, **Departure time**, list view, and Day Planner.","expect":"Bulk scheduling adjusts arrival/departure to fit the day; animals are scheduled (not left list-only unscheduled)."}],"group":"itinerary"},{"id":"ITIN-11","title":"Past-date recovery and seasonal date change","steps":[{"number":1,"name":"Save an itinerary","do":"Build and **Finish** an itinerary with some animals.","expect":"Saved itinerary present."},{"number":2,"name":"Backdate visit day","do":"In a terminal at the repo root, run `npm run backdate:itinerary`.","expect":"Terminal prints that the itinerary date was backdated to yesterday."},{"number":3,"name":"Trigger past-date recovery","do":"Open or hard-refresh **Itinerary**.","expect":"**Itinerary Date Has Passed** appears with **Clear** and **Choose New Date**."},{"number":4,"name":"Choose new date","do":"Click **Choose New Date**, pick an allowed visit date, then **Finish**.","expect":"**Choose a New Visit Date** runs; itinerary saves for the new date."},{"number":5,"name":"Alternate clear path","do":"Save another itinerary, run `npm run backdate:itinerary` again, hard-refresh **Itinerary**, then click **Clear**.","expect":"Itinerary clears to the empty panel; the builder does not open."},{"number":6,"name":"Save a summer itinerary","do":"Build and **Finish** an itinerary on a peak-summer visit date (e.g. a day in **July**). Include **Warthog** and **River Hippopotamus**, and add **Splash Island** on **Add Attractions**.","expect":"Summer itinerary saved with those animals and **Splash Island**."},{"number":7,"name":"Change date to midwinter","do":"Use **Edit Itinerary**, open **Set Visit Date**, pick a midwinter date (e.g. a day in **January**), then **Finish**.","expect":"**Itinerary Updated** appears."},{"number":8,"name":"Review seasonal removals","do":"In **Itinerary Updated**, open **Removed Animals** and **Removed Attractions**.","expect":"**Warthog** and **River Hippopotamus** are listed under **Removed Animals**; **Splash Island** is listed under **Removed Attractions**."},{"number":9,"name":"Keep vs remove","do":"Use **Keep** / remove choices where offered, then accept the popup.","expect":"Choices apply to the itinerary."},{"number":10,"name":"Coherent winter result","do":"Inspect list / Day Planner after accepting.","expect":"Visit date is the midwinter day; kept or removed items match the choices from step 9."}],"group":"itinerary"},{"id":"ITIN-12","title":"Map path smoke on itinerary","steps":[{"number":1,"name":"Multi-stop planner","do":"Ensure Day Planner has ≥2 scheduled stops.","expect":"Pills visible."},{"number":2,"name":"Walk path drawn","do":"Inspect itinerary map.","expect":"Walk path/route overlay drawn."},{"number":3,"name":"Pan/zoom path","do":"Pan/zoom the itinerary map.","expect":"Path remains visible/coherent."},{"number":4,"name":"Unschedule middle","do":"Unschedule a middle stop.","expect":"Path updates (not stale)."},{"number":5,"name":"Add Zoomobile transport","do":"Add Zoomobile as transportation and schedule/rebuild as needed.","expect":"Transport reflected in legs/path."},{"number":6,"name":"Path reflects transport","do":"Inspect path/legs.","expect":"Transport segment distinguishable or walking reduced as designed."},{"number":7,"name":"Scenic vs transport","do":"If Zoomobile also exists as scenic attraction, ensure scenic add does not impersonate transport leg.","expect":"Representations distinct."},{"number":8,"name":"Unschedule all clears path","do":"**Unschedule all items**.","expect":"Walk path clears."}],"group":"itinerary"},{"id":"CON-01","title":"Animal off/on display","steps":[{"number":1,"name":"Open off-display op","do":"Select **Set animal as off display**.","expect":"Form opens with species/exhibit fields."},{"number":2,"name":"Choose species/exhibit","do":"Autocomplete species + exhibit.","expect":"Valid pair selected."},{"number":3,"name":"Scope outdoor only","do":"Set viewing scope to **Outdoor only**.","expect":"Scope saved in the form."},{"number":4,"name":"Date range + reason","do":"Set start ≤ D (**Last day** blank or ≥ D). Enter **Reason**.","expect":"Fields valid; blank **Last day** means until manually on-display."},{"number":5,"name":"Submit off display","do":"Submit the form.","expect":"Success status like “{species} in {exhibit} was set as off display.”"},{"number":6,"name":"Map without include","do":"From the bottom nav, open **Map**. On **Specific Map**, set date D. Leave **Include off display animals** unchecked.","expect":"Animal absent or not shown as normally on-display (per product rules)."},{"number":7,"name":"Map with include","do":"Enable **Include off display animals**.","expect":"Animal appears and/or off-display banner/message is shown."},{"number":8,"name":"Itinerary confirm","do":"From the bottom nav, open **Itinerary** for date D, then try adding the animal (enable **Include off-display animals** if needed).","expect":"Off-display / low-likelihood confirm appears, or animal listing reflects off-display — note which."},{"number":9,"name":"Set on display","do":"In console, open **Set animal as on display** for the same species/exhibit/scope.","expect":"Form accepts the pair."},{"number":10,"name":"Submit on display","do":"Submit.","expect":"Success status like “… was set as on display.”"},{"number":11,"name":"Map restored","do":"From the bottom nav, return to **Map** on date D with **Include off display animals** unchecked.","expect":"Animal shows as a normal on-display marker again."},{"number":12,"name":"Cleanup confirmed","do":"Confirm no leftover off-display for D.","expect":"Guest map/itinerary behave as on-display."}],"group":"console"},{"id":"CON-02","title":"Visibility schedule","steps":[{"number":1,"name":"Open set schedule","do":"Select **Set animal visibility schedule**.","expect":"Form opens."},{"number":2,"name":"Fill window","do":"Set daily viewing start/end, **Schedule start date** / **Last day of schedule** covering D, **Message**.","expect":"Fields valid."},{"number":3,"name":"Submit","do":"Submit.","expect":"Success “… viewing schedule updated.”"},{"number":4,"name":"Map limited-viewing cue","do":"Map on D; find animal marker badge/limited-viewing styling.","expect":"Limited-viewing cue present."},{"number":5,"name":"Tooltip/message","do":"Open tooltip.","expect":"Viewing message visible."},{"number":6,"name":"Itinerary window","do":"On itinerary for D, schedule the animal inside vs outside the daily window if practical.","expect":"Respects or warns — note behavior."},{"number":7,"name":"Remove schedule","do":"Select **Remove visibility schedule** for same species/exhibit.","expect":"Form OK."},{"number":8,"name":"Submit remove","do":"Submit.","expect":"Success “… no longer has a visibility schedule.”"},{"number":9,"name":"Map cue gone","do":"Map on D.","expect":"Limited-viewing cue gone."},{"number":10,"name":"Itinerary normal","do":"Scheduling behaves without limited-window constraint.","expect":"Normal."}],"group":"console"},{"id":"CON-03","title":"Animal viewing alert","steps":[{"number":1,"name":"Set alert","do":"Open **Set animal viewing alert**; species/exhibit, dates covering D, alert text.","expect":"Form valid."},{"number":2,"name":"Submit alert","do":"Submit.","expect":"Success “… was given a viewing alert.”"},{"number":3,"name":"Map shows alert","do":"Map tooltip/banner for that animal on D.","expect":"Alert text shown."},{"number":4,"name":"Remove alert","do":"Open **Remove animal viewing alert**.","expect":"Form OK."},{"number":5,"name":"Submit remove","do":"Submit.","expect":"Success “Viewing alert removed…”"},{"number":6,"name":"Map clear","do":"Map on D.","expect":"Alert gone."},{"number":7,"name":"Map-only impact OK","do":"No itinerary required for Pass if map verified.","expect":"Noted."},{"number":8,"name":"Cleanup","do":"Confirm no alert remains.","expect":"Clean."}],"group":"console"},{"id":"CON-04","title":"Exhibit closed/open","steps":[{"number":1,"name":"Open close exhibit","do":"Select **Set exhibit as closed**.","expect":"Form opens."},{"number":2,"name":"Fill closure","do":"Pick exhibit, date range covering D, guest message.","expect":"Fields valid."},{"number":3,"name":"Submit closed","do":"Submit.","expect":"Success “{exhibit} was set as closed.” (or equivalent)."},{"number":4,"name":"Map overlay","do":"From the bottom nav, open **Map**. On **Specific Map**, set date D.","expect":"Closed-exhibit overlay/styling appears for that exhibit."},{"number":5,"name":"Itinerary impact","do":"Build/edit itinerary for D involving animals in that exhibit.","expect":"Animals constrained, warned, or harder to plan as designed — note behavior."},{"number":6,"name":"Open exhibit op","do":"Select **Set exhibit as open**.","expect":"Form opens."},{"number":7,"name":"Submit open","do":"Re-open for range covering D.","expect":"Success open status."},{"number":8,"name":"Overlay gone","do":"From the bottom nav, return to **Map** on **Specific Map** date D.","expect":"Closed overlay absent."},{"number":9,"name":"Itinerary normal","do":"Recheck itinerary animal availability for that exhibit on D.","expect":"Normal selection resumes."},{"number":10,"name":"Cleanup","do":"Confirm exhibit open on D.","expect":"No leftover closure."}],"group":"console"},{"id":"CON-05","title":"Restaurant closed / override / schedule","steps":[{"number":1,"name":"Set closed","do":"**Set restaurant as closed** for range covering D + message.","expect":"Success closed."},{"number":2,"name":"Map without include","do":"Map D; **Include closed restaurants** off.","expect":"Restaurant hidden/closed treatment."},{"number":3,"name":"Map with include","do":"Enable **Include closed restaurants**.","expect":"Visible + closed message."},{"number":4,"name":"Closure override","do":"**Create restaurant closure override** so D (or a sub-range) reopens.","expect":"Success override saved."},{"number":5,"name":"Map reflects override","do":"Map on overridden open day.","expect":"Appears open/available as designed."},{"number":6,"name":"Opening schedule conflict","do":"**Set restaurant opening schedule** overlapping an existing schedule.","expect":"**Schedule conflict** dialog if overlap exists."},{"number":7,"name":"Resolve overlap","do":"Choose **Trim Old Schedules** or **Delete Old Schedules**.","expect":"Schedule saves; note choice."},{"number":8,"name":"Map matches schedule","do":"Map on a day implied open by new schedule.","expect":"Open state correct."},{"number":9,"name":"Cleanup closed","do":"Ensure D is not left closed unintentionally.","expect":"Open or intentionally documented."},{"number":10,"name":"Verify map open","do":"Map D with include-closed off.","expect":"Normal open marker if intended open."},{"number":11,"name":"Status messages","do":"Confirm each submit showed success status text.","expect":"Statuses OK."},{"number":12,"name":"Notes","do":"Record overlap choice and restaurant name.","expect":"Notes filled."}],"group":"console"},{"id":"CON-06","title":"Restroom closed/open + alert","steps":[{"number":1,"name":"Close restroom","do":"**Set restroom as closed** for D.","expect":"Success."},{"number":2,"name":"Map closed behavior","do":"Map D; try with/without **Include closed restrooms**.","expect":"Show/hide matches toggles."},{"number":3,"name":"Set alert","do":"**Set restroom alert** (same or another restroom) covering D.","expect":"Success alert."},{"number":4,"name":"Map alert badge","do":"Map shows alert badge/styling.","expect":"Alert visible."},{"number":5,"name":"Remove alert","do":"**Remove restroom alert**.","expect":"Success removed."},{"number":6,"name":"Open restroom","do":"**Set restroom as open**.","expect":"Success open."},{"number":7,"name":"Map open","do":"Map D.","expect":"Restroom open/normal."},{"number":8,"name":"Include-closed spot-check","do":"Toggle include closed restrooms once more.","expect":"Behaves."},{"number":9,"name":"Cleanup","do":"No leftover closure/alert.","expect":"Clean."},{"number":10,"name":"Pass criteria","do":"Marker state matches last ops.","expect":"Pass if matched."}],"group":"console"},{"id":"CON-07","title":"Gift shop closed / override / schedule","steps":[{"number":1,"name":"Set closed","do":"**Set gift shop as closed** covering D.","expect":"Success."},{"number":2,"name":"Map without include","do":"Map; **Include closed gift shops** off.","expect":"Hidden/closed."},{"number":3,"name":"Map with include","do":"Enable include closed gift shops.","expect":"Visible + message."},{"number":4,"name":"Override or schedule","do":"Either **Create gift shop closure override** OR **Set gift shop opening schedule**.","expect":"Success path chosen — note which."},{"number":5,"name":"Overlap if schedule","do":"If schedule overlaps, resolve **Schedule conflict**.","expect":"Trim/Delete/Cancel noted."},{"number":6,"name":"Map after change","do":"Map on D / open day.","expect":"Matches intended open/closed."},{"number":7,"name":"Cleanup closed","do":"Re-open if still closed.","expect":"Open."},{"number":8,"name":"Verify map","do":"Include-closed off.","expect":"Normal marker if open."},{"number":9,"name":"Statuses","do":"Each submit showed success.","expect":"OK."},{"number":10,"name":"Notes","do":"Record gift shop name and path used.","expect":"Notes."}],"group":"console"},{"id":"CON-08","title":"Attraction closed / override / schedule / hours","steps":[{"number":1,"name":"Set attraction hours","do":"Open **Set attraction hours**. Set weekday and weekend/holiday start/end within zoo hours.","expect":"Form validates."},{"number":2,"name":"Submit hours","do":"Submit.","expect":"Success “{name} attraction hours were saved.”"},{"number":3,"name":"Itinerary hours snap","do":"On itinerary for a day those hours apply, schedule the attraction outside its open window.","expect":"UI snaps to nearest valid time or warns — note which."},{"number":4,"name":"Set attraction closed","do":"Open **Set attraction as closed** for range covering D + message.","expect":"Submit success closed."},{"number":5,"name":"Map closed","do":"Map on D with **Include closed attractions** unchecked then checked.","expect":"Hidden/closed without include; visible + message with include."},{"number":6,"name":"Itinerary closed confirm","do":"Try adding the attraction on D.","expect":"**Attraction May Be Closed** / closed confirm appears."},{"number":7,"name":"Override or reopen","do":"Use **Create attraction closure override** or set open / end closure so D is effectively open.","expect":"Success status."},{"number":8,"name":"Opening schedule","do":"Open **Set attraction opening schedule**; set a weekly pattern.","expect":"Saves, or **Schedule conflict** dialog if overlapping (**Trim Old Schedules** / **Delete Old Schedules**)."},{"number":9,"name":"Resolve overlap if shown","do":"If overlap dialog appears, choose Trim or Delete and confirm.","expect":"Schedule saves; note choice."},{"number":10,"name":"Map open state","do":"Map on D.","expect":"Attraction appears open/normal without needing include-closed."},{"number":11,"name":"Hours still valid","do":"Spot-check itinerary scheduling still respects hours.","expect":"Snap/hours behavior still coherent."},{"number":12,"name":"Cleanup","do":"Remove test closure/override; leave attraction open.","expect":"Guest map clean for D."}],"group":"console"},{"id":"CON-09","title":"Transportation station + current route","steps":[{"number":1,"name":"Close station","do":"**Set transportation station as closed** for D.","expect":"Success."},{"number":2,"name":"Map station closed","do":"Map D with Zoomobile route visible.","expect":"Station closed/missing/messaged."},{"number":3,"name":"Open station","do":"**Set transportation station as open**.","expect":"Success."},{"number":4,"name":"Set Summer route","do":"**Set current transportation route** — choose **Summer**, date range including D.","expect":"Success “Transportation route was set to …”"},{"number":5,"name":"Map summer","do":"Map Explore → Summer/Current as applicable.","expect":"Summer route layer/stations."},{"number":6,"name":"Set Winter route","do":"Set route to **Winter** for a range.","expect":"Success."},{"number":7,"name":"Map winter","do":"Map shows winter route treatment.","expect":"Winter differs from summer where designed."},{"number":8,"name":"Itinerary transport","do":"If itinerary transport options change with route, spot-check.","expect":"Noted or N/A."},{"number":9,"name":"Restore route","do":"Set route back to the previous/current intended season.","expect":"Restored."},{"number":10,"name":"Cleanup stations","do":"Confirm stations open on D.","expect":"Open."}],"group":"console"},{"id":"CON-10","title":"Guardians talks","steps":[{"number":1,"name":"Set schedule","do":"**Set Meet the Guardians talk schedule** with **Location**, **Talk name**, recurring **Talk times**, range including D (**Stops being offered on** as needed).","expect":"Success schedule saved."},{"number":2,"name":"Map talk visible","do":"Map D; enable **Meet The Guardians Talks** filter.","expect":"Talk marker/tooltip present."},{"number":3,"name":"Itinerary lists talk","do":"Itinerary builder on D; Meet the Guardians step.","expect":"Talk offered."},{"number":4,"name":"Add occurrence","do":"**Add Meet the Guardians talk occurrence** for a date/time.","expect":"Success added."},{"number":5,"name":"Cancel occurrence","do":"**Cancel Meet the Guardians talk occurrence**.","expect":"Success cancelled."},{"number":6,"name":"Cancelled absent","do":"Itinerary/map for cancelled slot.","expect":"Cancelled occurrence absent as designed."},{"number":7,"name":"End schedule","do":"**End Meet the Guardians talk schedule**.","expect":"Success ended."},{"number":8,"name":"Future clear","do":"Check a future date that was only covered by ended schedule.","expect":"Talks cleared as designed."},{"number":9,"name":"Duplicate time Notes","do":"Optionally resubmit duplicate time to see error.","expect":"Error string noted (optional)."},{"number":10,"name":"Cleanup","do":"No unintended live schedules left for test talk.","expect":"Clean."},{"number":11,"name":"Final map","do":"Map filter talks on D.","expect":"Quiet/expected state."},{"number":12,"name":"Record names","do":"Notes: talk + location + D.","expect":"Notes."}],"group":"console"},{"id":"CON-11","title":"Wild encounters","steps":[{"number":1,"name":"Set schedule","do":"**Set Wild Encounter schedule** including D.","expect":"Success saved."},{"number":2,"name":"Map verify","do":"Map D; enable **Wild Encounters** filter.","expect":"Meeting spot / encounter marker visible."},{"number":3,"name":"Itinerary selector","do":"Itinerary Wild Encounters step on D.","expect":"Encounter listed."},{"number":4,"name":"Cancel occurrence","do":"**Cancel Wild Encounter occurrence** (add occurrence first only if required to have something to cancel).","expect":"Success cancelled."},{"number":5,"name":"Cancelled absent","do":"Itinerary/map for that slot.","expect":"Absent as designed."},{"number":6,"name":"End schedule","do":"**End Wild Encounter schedule**.","expect":"Success ended."},{"number":7,"name":"Future clear","do":"Future date check.","expect":"Cleared as designed."},{"number":8,"name":"Duplicate time optional","do":"Optional duplicate-time validation Notes.","expect":"Optional."},{"number":9,"name":"Cleanup","do":"No leftover test schedule.","expect":"Clean."},{"number":10,"name":"Final map","do":"Map quiet/expected.","expect":"OK."}],"group":"console"},{"id":"CON-12","title":"Drinking fountains","steps":[{"number":1,"name":"Close fountains","do":"**Close drinking fountains** for a window covering D; optional message.","expect":"Success closed."},{"number":2,"name":"Map markers/banners","do":"Map D; enable **Drinking Fountains** filter.","expect":"Closed treatment and/or banners."},{"number":3,"name":"Open fountains","do":"**Open drinking fountains**.","expect":"Success open."},{"number":4,"name":"Map restored","do":"Map D.","expect":"Fountains restored/open treatment."},{"number":5,"name":"Filter toggle","do":"Toggle Drinking Fountains filter off/on.","expect":"Markers show/hide."},{"number":6,"name":"Seasonal Notes","do":"Note interaction with seed seasonal fountain curve if visible.","expect":"Notes."},{"number":7,"name":"Cleanup","do":"Fountains open after suite.","expect":"Open."},{"number":8,"name":"Pass","do":"Map matches final open state.","expect":"Pass."}],"group":"console"},{"id":"CON-13","title":"Updates CRUD","steps":[{"number":1,"name":"Create update","do":"**Create update** with **Title**, **Description**, **Type** (e.g. New Arrival), **Start date** covering D, optional **No longer applies on**.","expect":"Success created."},{"number":2,"name":"Map Updates shows it","do":"Map Explore → **Updates** on D.","expect":"Update visible."},{"number":3,"name":"Edit update","do":"**Edit update** description/type/end.","expect":"Success edited."},{"number":4,"name":"Map reflects edit","do":"Refresh Updates on D.","expect":"Edited content shown."},{"number":5,"name":"End update","do":"**End update** effective on/before D as designed.","expect":"Success ended."},{"number":6,"name":"Map inactive","do":"Updates on D.","expect":"No longer listed as active (or ended treatment)."},{"number":7,"name":"Inside vs outside range","do":"Before ending, flip map date inside/outside range once.","expect":"Presence matches range."},{"number":8,"name":"Cleanup","do":"Ensure test update ended.","expect":"Clean enough for other suites."},{"number":9,"name":"No crash","do":"Carousel/collapse still works.","expect":"OK."},{"number":10,"name":"Pass","do":"CRUD + map verify done.","expect":"Pass."}],"group":"console"},{"id":"CON-14","title":"Create event","steps":[{"number":1,"name":"Create event","do":"**Create event** with name, location, description, optional link, dates covering D.","expect":"Success created."},{"number":2,"name":"Map Events shows","do":"Map Explore → **Events** on D.","expect":"Event visible."},{"number":3,"name":"Open link","do":"If link present, open/check it.","expect":"Link works or N/A."},{"number":4,"name":"Outside range","do":"Set map date outside event range.","expect":"Event absent."},{"number":5,"name":"Inside range again","do":"Return map date to D.","expect":"Event present."},{"number":6,"name":"No itinerary required","do":"Skip itinerary.","expect":"Map-only verify OK."},{"number":7,"name":"Endability Notes","do":"Check whether console can end/delete event.","expect":"Notes."},{"number":8,"name":"Pass","do":"Create + map date gating verified.","expect":"Pass."}],"group":"console"},{"id":"CON-15","title":"Console validation matrix","steps":[{"number":1,"name":"Missing entity","do":"Submit an op that requires an entity with it blank (e.g. closed restaurant without name).","expect":"Validation: entity required style message."},{"number":2,"name":"End before start","do":"Enter end date before start date.","expect":"**End date cannot be before the start date.** (or Invalid start/end)."},{"number":3,"name":"Daily viewing times","do":"Visibility schedule without start/end times.","expect":"**Daily viewing start and end times are required.**"},{"number":4,"name":"Weekly preset locks","do":"Opening schedule: try **weekendsOnly** / holidays checkbox interaction.","expect":"Holidays checkbox locks/behaves per preset."},{"number":5,"name":"Attraction hours inverted","do":"**Set attraction hours** with weekday start after end.","expect":"**Weekday start time must be before weekday end time.**"},{"number":6,"name":"Hours outside zoo hours","do":"Set attraction hours outside zoo bounds.","expect":"Bounds validation or API invalid hours message."},{"number":7,"name":"Duplicate encounter time","do":"Wild encounter schedule with duplicate time rows.","expect":"**Each encounter time can only be added once.**"},{"number":8,"name":"Empty required message","do":"Closed op without required guest message if required.","expect":"Validation blocks submit."},{"number":9,"name":"Overlap Cancel","do":"Trigger **Schedule conflict** and click Cancel.","expect":"No schedule change applied."},{"number":10,"name":"Fix one form valid","do":"Correct one form to valid inputs.","expect":"Ready to submit."},{"number":11,"name":"Success submit","do":"Submit successfully.","expect":"Success status shown."},{"number":12,"name":"Cleanup success row","do":"Revert/end/delete that successful test row.","expect":"Clean."}],"group":"console"}];
(function () {
   var STORAGE_KEY = "tzg.manualTestResults.v1";
   var GROUP_LABELS = {"map":"Map","itinerary":"Itinerary","console":"Console"};
   var GROUPS = ["map","itinerary","console"];
   var suites = window.__SUITES__;
   var activeId = null;

   function byId( id ) {
      for ( var i = 0; i < suites.length; i += 1 ) {
         if ( suites[ i ].id === id ) return suites[ i ];
      }
      return null;
   }

   function loadAll() {
      try {
         var raw = localStorage.getItem( STORAGE_KEY );
         return raw ? JSON.parse( raw ) : {};
      } catch ( e ) {
         return {};
      }
   }

   function saveAll( all ) {
      localStorage.setItem( STORAGE_KEY, JSON.stringify( all ) );
   }

   function getSuiteResults( suiteId ) {
      return loadAll()[ suiteId ] || { steps: {} };
   }

   function setStepResult( suiteId, stepNumber, result ) {
      var all = loadAll();
      var saved = all[ suiteId ] || { steps: {} };
      var step = saved.steps[ stepNumber ] || {};
      if ( result ) step.result = result;
      else delete step.result;
      if ( !step.result && !step.notes ) delete saved.steps[ stepNumber ];
      else saved.steps[ stepNumber ] = step;
      all[ suiteId ] = saved;
      saveAll( all );
   }

   function setStepNotes( suiteId, stepNumber, notes ) {
      var all = loadAll();
      var saved = all[ suiteId ] || { steps: {} };
      var step = saved.steps[ stepNumber ] || {};
      step.notes = notes;
      saved.steps[ stepNumber ] = step;
      all[ suiteId ] = saved;
      saveAll( all );
   }

   function clearSuite( suiteId ) {
      var all = loadAll();
      delete all[ suiteId ];
      saveAll( all );
   }

   function escapeHtml( value ) {
      return String( value == null ? '' : value )
         .replace(/&/g, '&amp;')
         .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;')
         .replace(/"/g, '&quot;');
   }

   function applyNavProgress() {
      var buttons = document.querySelectorAll( '.suite-link' );
      for ( var i = 0; i < buttons.length; i += 1 ) {
         var button = buttons[ i ];
         var suite = byId( button.getAttribute( 'data-suite-id' ) );
         button.classList.remove( 'is-complete', 'is-partial', 'is-failed', 'is-active' );
         if ( suite && suite.id === activeId ) button.classList.add( 'is-active' );
         if ( !suite ) continue;
         var saved = getSuiteResults( suite.id );
         var results = [];
         Object.keys( saved.steps || {} ).forEach( function ( key ) {
            if ( saved.steps[ key ].result ) results.push( saved.steps[ key ].result );
         } );
         if ( results.length === 0 ) continue;
         if ( results.indexOf( 'fail' ) !== -1 ) {
            button.classList.add( 'is-failed' );
         } else if ( results.length >= suite.steps.length ) {
            button.classList.add( 'is-complete' );
         } else {
            button.classList.add( 'is-partial' );
         }
      }
   }

   function updateSummary( suite ) {
      var saved = getSuiteResults( suite.id );
      var pass = 0, fail = 0, blocked = 0;
      Object.keys( saved.steps || {} ).forEach( function ( key ) {
         var result = saved.steps[ key ].result;
         if ( result === 'pass' ) pass += 1;
         else if ( result === 'fail' ) fail += 1;
         else if ( result === 'blocked' ) blocked += 1;
      } );
      var answered = pass + fail + blocked;
      document.getElementById( 'summary' ).textContent =
         answered + '/' + suite.steps.length + ' recorded · ' + pass + ' pass · ' + fail + ' fail · ' + blocked + ' blocked';
   }

   function applyStepUi( article, savedStep ) {
      article.classList.remove( 'result-pass', 'result-fail', 'result-blocked' );
      if ( savedStep.result ) article.classList.add( 'result-' + savedStep.result );
      var buttons = article.querySelectorAll( '.result-btn' );
      for ( var i = 0; i < buttons.length; i += 1 ) {
         var btn = buttons[ i ];
         btn.setAttribute(
            'aria-pressed',
            savedStep.result === btn.getAttribute( 'data-result' ) ? 'true' : 'false'
         );
      }
      article.querySelector( '.notes' ).value = savedStep.notes || '';
   }

   function renderSuite( suiteId ) {
      var suite = byId( suiteId );
      if ( !suite ) return;
      activeId = suiteId;
      var saved = getSuiteResults( suite.id );
      var main = document.getElementById( 'main' );
      var html = '';
      html += '<header class="suite-header">';
      html += '<h1>' + escapeHtml( suite.id + ' — ' + suite.title ) + '</h1>';
      var metaFields = [
         { label: 'Preconditions', value: suite.preconditions },
         { label: 'Date under test', value: suite.dateUnderTest },
         { label: 'Cleanup', value: suite.cleanup }
      ];
      for ( var m = 0; m < metaFields.length; m += 1 ) {
         var metaValue = String( metaFields[ m ].value == null ? '' : metaFields[ m ].value ).trim();
         if ( !metaValue || /^none.?$/i.test( metaValue ) ) {
            continue;
         }
         html += '<p><strong>' + escapeHtml( metaFields[ m ].label ) + ':</strong> '
            + escapeHtml( metaFields[ m ].value ) + '</p>';
      }
      html += '<div class="actions">';
      html += '<button type="button" id="clearResults">Clear suite results</button>';
      html += '<button type="button" id="downloadResults">Download results JSON</button>';
      html += '</div></header>';
      html += '<p id="summary" class="summary"></p>';

      for ( var i = 0; i < suite.steps.length; i += 1 ) {
         var step = suite.steps[ i ];
         html += '<article class="step" data-step="' + step.number + '">';
         html += '<h2>Step ' + step.number + ' — ' + escapeHtml( step.name ) + '</h2>';
         html += '<p><strong>Do:</strong> ' + escapeHtml( step.do ) + '</p>';
         html += '<p><strong>Expect:</strong> ' + escapeHtml( step.expect ) + '</p>';
         html += '<div class="result-row"><span class="result-label">Result:</span>';
         html += '<button type="button" class="result-btn result-pass" data-result="pass" aria-label="Pass" title="Pass" aria-pressed="false">✓</button>';
         html += '<button type="button" class="result-btn result-fail" data-result="fail" aria-label="Fail" title="Fail" aria-pressed="false">✗</button>';
         html += '<button type="button" class="result-btn result-blocked" data-result="blocked" aria-label="Blocked" title="Blocked" aria-pressed="false">◌</button>';
         html += '</div>';
         html += '<label class="notes-label">Notes<textarea class="notes" rows="2" placeholder="Optional notes…"></textarea></label>';
         html += '</article>';
      }
      main.innerHTML = html;

      var articles = main.querySelectorAll( '.step' );
      for ( var a = 0; a < articles.length; a += 1 ) {
         (function ( article ) {
            var stepNumber = Number( article.getAttribute( 'data-step' ) );
            applyStepUi( article, saved.steps[ stepNumber ] || {} );
            var buttons = article.querySelectorAll( '.result-btn' );
            for ( var b = 0; b < buttons.length; b += 1 ) {
               buttons[ b ].addEventListener( 'click', function ( event ) {
                  var value = event.currentTarget.getAttribute( 'data-result' );
                  var current = getSuiteResults( suite.id ).steps[ stepNumber ] || {};
                  var next = current.result === value ? null : value;
                  setStepResult( suite.id, stepNumber, next );
                  applyStepUi( article, getSuiteResults( suite.id ).steps[ stepNumber ] || {} );
                  updateSummary( suite );
                  applyNavProgress();
               } );
            }
            article.querySelector( '.notes' ).addEventListener( 'input', function ( event ) {
               setStepNotes( suite.id, stepNumber, event.target.value );
            } );
         })( articles[ a ] );
      }

      document.getElementById( 'clearResults' ).addEventListener( 'click', function () {
         clearSuite( suite.id );
         renderSuite( suite.id );
      } );

      document.getElementById( 'downloadResults' ).addEventListener( 'click', function () {
         var payload = {
            suiteId: suite.id,
            exportedAt: new Date().toISOString(),
            results: getSuiteResults( suite.id )
         };
         var blob = new Blob( [ JSON.stringify( payload, null, 2 ) ], { type: 'application/json' } );
         var url = URL.createObjectURL( blob );
         var anchor = document.createElement( 'a' );
         anchor.href = url;
         anchor.download = suite.id + '-results.json';
         anchor.click();
         URL.revokeObjectURL( url );
      } );

      updateSummary( suite );
      applyNavProgress();
      document.getElementById( 'status' ).textContent =
         suite.id + ': click ✓ / ✗ / ◌ to record results (saved in this browser).';

      try {
         history.replaceState( {}, '', '#' + encodeURIComponent( suite.id ) );
      } catch ( e ) {}
   }

   function renderNav() {
      var nav = document.getElementById( 'nav' );
      var html = '';
      for ( var g = 0; g < GROUPS.length; g += 1 ) {
         var group = GROUPS[ g ];
         html += '<h2>' + escapeHtml( GROUP_LABELS[ group ] ) + '</h2><ul class="suite-list">';
         for ( var i = 0; i < suites.length; i += 1 ) {
            if ( suites[ i ].group !== group ) continue;
            html += '<li><button type="button" class="suite-link" data-suite-id="' +
               escapeHtml( suites[ i ].id ) + '">' +
               escapeHtml( suites[ i ].id + ' — ' + suites[ i ].title ) +
               '</button></li>';
         }
         html += '</ul>';
      }
      nav.innerHTML = html;
      var buttons = nav.querySelectorAll( '.suite-link' );
      for ( var b = 0; b < buttons.length; b += 1 ) {
         buttons[ b ].addEventListener( 'click', function ( event ) {
            renderSuite( event.currentTarget.getAttribute( 'data-suite-id' ) );
         } );
      }
   }

   renderNav();
   var hashId = ( location.hash || '' ).replace( /^#/, '' );
   var start = byId( decodeURIComponent( hashId ) ) || suites[ 0 ];
   if ( start ) renderSuite( start.id );
})();
   </script>
</body>
</html>
