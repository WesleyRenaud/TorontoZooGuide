<td style="padding:6px;vertical-align:top;" width="50%">
   <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{background};border:1px solid {edge};border-radius:10px;">
      <tr>
         <td style="padding:14px 8px 14px 16px;font-family:{font};font-size:13px;line-height:18px;font-weight:500;color:{text};">{label}</td>
         <td style="padding:10px 16px 10px 8px;font-family:{font};font-size:26px;line-height:30px;font-weight:700;color:{number_color};text-align:right;" align="right">{count}</td>
      </tr>
   </table>
</td>
