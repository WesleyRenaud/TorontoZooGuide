<td style="padding:6px;vertical-align:top;" width="50%">
   <table role="presentation" width="100%" height="64" cellpadding="0" cellspacing="0" style="height:64px;background:{background};border:1px solid {edge};border-radius:10px;">
      <tr>
         <td height="64" valign="middle" style="height:64px;padding:0 8px 0 16px;font-family:{font};font-size:13px;line-height:18px;font-weight:500;color:{text};vertical-align:middle;">{label}</td>
         <td height="64" valign="middle" style="height:64px;padding:0 16px 0 8px;font-family:{font};font-size:26px;line-height:30px;font-weight:700;color:{number_color};text-align:right;vertical-align:middle;" align="right">{count}</td>
      </tr>
   </table>
</td>
