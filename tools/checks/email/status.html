<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{white};border-top:4px solid {green_highlight};border-radius:0 0 12px 12px;">
   <tr>
      <td style="padding:20px 24px 2px;font-family:{font};font-size:30px;line-height:36px;font-weight:700;color:{headline_color};">{headline}</td>
   </tr>
   <tr>
      <td style="padding:0 24px 20px;font-family:{font};font-size:15px;line-height:22px;font-weight:400;color:{text};">{summary}</td>
   </tr>
</table>
